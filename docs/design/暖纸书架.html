<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><link rel="icon" href="data:,"><title>暖纸书架 · 设计比较</title>
<!-- 独立选稿：暖纸、炭墨、陶土；标题 22–28px，书名 16px，操作 14px；4px 间距基准。布局切换不重置查询。 -->
<style>
*{box-sizing:border-box}body{--paper:#f7f5ef;--ink:#302e29;--soft:#69645d;--line:#dad5cb;--clay:#99503b;--white:#fffefa;margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 'PingFang SC','Microsoft YaHei UI',sans-serif}button,input{font:inherit;color:inherit}button{min-height:44px;cursor:pointer;background:transparent;border:0}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--clay);outline-offset:2px}h1,h2,h3,p{margin:0}header,main,footer{max-width:790px;margin:auto;padding-inline:22px}header{min-height:55px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand,.modes,.sources,form,.bar,.row,.copy,footer{display:flex;align-items:center}.brand{gap:8px;font-weight:620}.brand i{height:19px;width:16px;border:1px solid #86513d;border-left:4px double #86513d;border-radius:2px;transform:rotate(-8deg)}.modes{gap:3px}.modes button{padding:0 8px;color:var(--soft);font-size:13px}.modes button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--clay);text-underline-offset:5px}main{padding-top:clamp(24px,6vh,58px);min-height:72vh;padding-bottom:28px}.workspace{max-width:610px;margin:auto}.sources{gap:15px;margin-bottom:6px}.sources button{padding:0 1px;color:var(--soft)}.sources [aria-pressed=true]{color:var(--clay);font-weight:650}h1,.name,.binding{font-family:'Noto Serif CJK SC','Songti SC',SimSun,serif}h1{font-size:clamp(23px,3vw,28px);font-weight:600;letter-spacing:.02em;margin:0 0 14px}form{background:var(--white);border:1px solid #ccc7bc;border-radius:10px;padding:2px 5px 2px 14px;gap:7px}form:focus-within{border-color:#977e70}form input{border:0;min-width:0;flex:1;min-height:44px;font-size:16px;background:transparent}form input:focus{outline:none}form button{color:var(--clay);font-weight:600;padding:0 12px}.bar{margin:26px 0 5px;justify-content:space-between;color:var(--soft);font-size:12px}.bar h2{font-size:14px;color:var(--ink);font-weight:560}.row{padding:12px 0;border-bottom:1px solid var(--line);gap:12px;min-width:0}.copy{display:block;min-width:0}.name{font-size:17px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--soft);margin-top:3px}.binding{background:#dfdfcc;color:#454d3d;width:32px;height:43px;flex:none;border-left:3px double #948e76;display:grid;place-items:center;font-size:12px}.row:nth-child(2) .binding{background:#edd6c6;color:#754936}.row:nth-child(3) .binding{background:#d7dfe1;color:#3c5461}.end{margin-left:auto;color:var(--soft);font-size:12px}.empty{color:var(--soft);margin:18px 0}.layout-b .workspace{display:grid;grid-template-columns:minmax(0,1fr);max-width:710px}.layout-b .top{display:flex;align-items:center;justify-content:space-between}.layout-b .sources{order:1;margin:0}.layout-b h1{margin:0}.layout-b .list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.layout-b .row{display:block;border:0;padding:3px 0}.layout-b .binding{width:100%;height:auto;aspect-ratio:3/4;max-height:162px;place-content:start center;padding:12px 6px;font-size:15px;letter-spacing:.1em;writing-mode:vertical-rl;align-items:center}.layout-b .copy{margin-top:7px}.layout-b .name{font-size:15px}.layout-b .end{display:none}.layout-b .top+form{order:2;margin-top:24px}.layout-b form:focus-within{order:2}footer{border-top:1px solid var(--line);justify-content:space-between;color:var(--soft);font-size:12px;padding-block:12px}.bar button{color:var(--clay);font-size:12px} @media(max-width:500px){header,main,footer{padding-inline:16px}main{padding-top:16px}.bar{margin-top:18px}.layout-b .list{gap:10px}.layout-b .binding{max-height:138px}.modes button{padding-inline:6px}}@media(prefers-reduced-motion:no-preference){.row{animation:show .16s ease-out}@keyframes show{from{opacity:.65}to{opacity:1}}}
</style></head><body><header><span class="brand"><i aria-hidden="true"></i>小说书架</span><div class="modes" aria-label="对比布局"><button data-layout="a" aria-pressed="true">先找书</button><button data-layout="b" aria-pressed="false">先看书</button></div></header><main><div class="workspace"><div class="top"><div class="sources" aria-label="书源"><button aria-pressed="true">番茄</button><button aria-pressed="false">七猫</button></div><h1>番茄书架</h1></div><form><input type="search" enterkeyhint="search" aria-label="书名或作者" placeholder="输入书名或作者"><button>搜索</button></form><div class="bar"><h2>示例书目</h2><span id="count"></span></div><div class="list" aria-live="polite"></div></div></main><footer><span>离线设计稿 · 不会下载或扣次</span><span id="choice">一 / 搜索优先</span></footer>
<script>
const data={番茄:[['山海手记','林川','旅行'],['最后一班渡船','江屿','故事'],['潮声以南','许南','随笔']],七猫:[['夜航电台','周野','都市'],['渡口来信','江屿','书信'],['沿岸漫步','林川','旅行']]};let source='番茄',query='';const input=document.querySelector('input'),list=document.querySelector('.list');function draw(){document.querySelector('h1').textContent=source+'书架';const items=data[source].filter(b=>b.join(' ').includes(query));document.querySelector('#count').textContent=items.length+' 本';document.querySelector('.bar h2').textContent=query?'搜索结果':'示例书目';list.replaceChildren();for(const [name,author,type] of items){const row=document.createElement('article');row.className='row';row.innerHTML=`<div class="binding" aria-hidden="true">${document.body.classList.contains('layout-b')?name:name[0]}</div><div class="copy"><h3 class="name">${name}</h3><div class="meta">${author}</div></div><span class="end">${type}</span>`;list.append(row)}if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='没有匹配的示例。试试「林川」。';list.append(p)}}document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{const alt=b.dataset.layout==='b';document.body.classList.toggle('layout-b',alt);document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('#choice').textContent=alt?'二 / 书目优先':'一 / 搜索优先';draw()});document.querySelectorAll('.sources button').forEach(b=>b.onclick=()=>{source=b.textContent;document.querySelectorAll('.sources button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});document.querySelector('form').onsubmit=e=>{e.preventDefault();query=input.value.trim();input.blur();draw()};input.onsearch=()=>{if(!input.value){query='';draw()}};draw();
</script></body></html>
