<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><link rel="icon" href="data:,"><title>小说书架 · 四稿对照</title>
<!-- 比较基准：相同的三本示例书、相同的搜索与文件状态。正文 14px，书名 15–19px，触控操作最小高度 44px。A 使用报刊栏线，B 使用系统列表，C 使用书封陈列，D 使用侧栏索引。 -->
<style>
*{box-sizing:border-box}body{margin:0;color:#292b2d;background:#edeeec;font:14px/1.5 'Microsoft YaHei UI','PingFang SC',sans-serif}h1,h2,h3,p{margin:0}button,input{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;background:none;border:0}button:focus-visible,input:focus-visible{outline:2px solid #777;outline-offset:2px}main{max-width:1240px;margin:auto;padding:24px clamp(12px,3vw,40px) 50px}.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.mast h1{font-size:22px;letter-spacing:.04em}.mast p,.note{color:#535758;font-size:13px}.pick{display:flex;gap:3px;flex-wrap:wrap;margin:12px 0 18px;border-block:1px solid #b7bbb8}.pick button{padding:0 12px}.pick [aria-pressed=true]{box-shadow:inset 0 -2px;color:#121718;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.sample{min-width:0}.sample[hidden]{display:none}.grid.single{grid-template-columns:minmax(0,430px);justify-content:center}.cap{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}.cap b{font:650 15px/1.3 Georgia,serif}.cap h2{font-size:15px}.cap small{margin-left:auto;color:#505557}.frame{--paper:#fff;--ink:#242729;--weak:#626a6c;--rule:#d6d9d8;--mark:#173f56;background:var(--paper);color:var(--ink);border:1px solid var(--rule);position:relative;display:flex;flex-direction:column;min-height:376px;padding:14px 18px;gap:10px}.head,.find,.sectionline,.dest,.entry,.source{display:flex;align-items:center}.head{justify-content:space-between;gap:8px}.head strong{font-size:18px}.head small,.by,.sectionline,.serial{color:var(--weak)}.find{gap:7px}.find input{min-width:0;flex:1;font-size:16px;background:transparent;border:0}.find button{padding:0 12px;font-size:13px;font-weight:600}.sectionline{justify-content:space-between;font-size:12px}.dest{gap:2px}.dest button{flex:1;font-size:13px;color:var(--weak)}.dest [aria-current]{color:var(--mark);font-weight:700}.list{flex:1}.entry{gap:10px;min-height:53px;border-bottom:1px solid var(--rule)}.name{font-size:15px;font-weight:600}.by{font-size:12px}.serial{font:12px/1.3 Consolas,monospace}.meta{min-width:0}.name,.by{overflow-wrap:anywhere}.note{margin-top:20px}.zero{padding:22px 0;color:var(--weak)}.source{gap:6px}.source button{padding:0 8px;font-size:13px}.source [aria-current]{text-decoration:underline;text-underline-offset:5px}.tip{margin:0;color:var(--weak);font-size:12px}.code{margin-left:auto;font:12px Consolas,monospace;color:var(--weak)}
/* A：双线刊头、右对齐作者和页脚索引。 */
.a{--paper:#faf7f0;--rule:#d3c9b8;--mark:#853b32}.a .head{border-block:3px double #51473d;padding-block:5px}.a .head strong,.a .name{font-family:'Songti SC',SimSun,serif}.a .head strong{font-size:23px;letter-spacing:.15em}.a .find{border-bottom:1px solid var(--ink)}.a .find button{color:var(--mark)}.a .meta{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:5px}.a .dest{border-top:1px solid var(--ink)}.a .dest [aria-current]::before{content:'§ ';color:var(--mark)}
/* B：分区式手机工具栏，一列一行，不用卡片堆叠。 */
.b{--paper:#f4f6f8;--mark:#365c83;--rule:#d9dee4}.b .head{padding:0 2px}.b .head strong{font-size:16px}.b .find{background:white;border:1px solid var(--rule);padding-left:10px;border-radius:8px}.b .find button{border-left:1px solid var(--rule)}.b .dest{order:-1;border-bottom:1px solid var(--rule)}.b .dest [aria-current]{box-shadow:inset 0 -2px}.b .list{background:white;padding:0 10px;border:1px solid var(--rule);border-radius:7px}.b .entry:last-child{border:0}.b .serial{width:26px;height:31px;border:1px solid #a5b5c4;border-radius:2px;color:#476784;display:grid;place-items:center;font-size:10px}.b .by{margin-top:2px}
/* C：三册并排的试排封面，书名与作者在封面下对齐。 */
.c{--paper:#f5f1e9;--mark:#465f44;--rule:#cfc9bc}.c .head{align-items:baseline}.c .head strong{font:600 20px 'Songti SC',SimSun,serif}.c .find{background:#fffdf9;padding-left:10px;border:1px solid var(--rule)}.c .list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.c .entry{display:block;border:0;min-width:0}.binding{aspect-ratio:3/4;max-height:144px;border-left:4px double #f4edd69c;padding:10px 7px;display:flex;justify-content:space-between;gap:3px;background:#435d50;color:white}.binding b{writing-mode:vertical-rl;font:600 15px/1.2 'Songti SC',SimSun,serif;overflow:hidden}.binding i{align-self:flex-end;font:10px Georgia,serif}.c .entry:nth-child(2) .binding{background:#846051}.c .entry:nth-child(3) .binding{background:#525e70}.c .name{font-size:13px;margin-top:6px}.c .dest{border-top:1px solid var(--rule)}.c .dest [aria-current]{text-decoration:underline;text-underline-offset:5px}
/* D：固定窄侧栏、深色索引和独立搜索行。 */
.d{--paper:#202426;--ink:#eeeae0;--weak:#b7b9b5;--rule:#42494a;--mark:#ead39b;padding-left:83px}.d .dest{position:absolute;inset:0 auto 0 0;width:65px;flex-direction:column;align-items:stretch;background:#171b1c;border-right:1px solid var(--rule);padding-top:12px}.d .dest button{flex:0 0 44px}.d .dest [aria-current]{background:#323734;box-shadow:inset 2px 0}.d .find{border-bottom:1px solid #88938b}.d .find button{color:var(--mark)}.d .serial{align-self:flex-start;margin-top:15px;color:var(--mark)}.d .sectionline{border-bottom:1px solid var(--rule);padding-bottom:4px}.d .entry{min-height:55px}.d input{color-scheme:dark}.d .head small{font-family:Consolas,monospace}
@media(max-width:740px){main{padding:12px 10px 24px}.grid{display:block}.sample{margin:0 auto 18px;max-width:440px}.mast h1{font-size:18px}.pick{flex-wrap:nowrap;gap:0}.pick button{flex:1;padding:0 4px;font-size:13px}.frame{min-height:370px;padding-inline:12px}.d{padding-left:74px}.d .dest{width:58px}.cap small{font-size:11px}.c .list{gap:8px}}@media(prefers-reduced-motion:no-preference){.frame{animation:in .15s ease-out}@keyframes in{from{opacity:.65}to{opacity:1}}}
</style></head><body><main><header class="mast"><h1>小说书架 · 风格对照</h1><p>同一组示例书目。可切换书源、查看文件或试搜作者，不会下载。</p></header><div class="pick" aria-label="选择对照方案"></div><div class="grid"></div><p class="note">封面为书名排版示例，非原书封面。选择时可分别指定布局、导航和配色。</p></main>
<script>
const variants=[['A','刊物索引','纸色 / 双线 / 右栏作者'],['B','原生清单','冷灰 / 顶部导航 / 紧凑列表'],['C','装帧书架','布面书脊 / 三列 / 底栏'],['D','夜间侧栏','炭灰 / 侧边导航 / 序号']];
const books=[['山海手记','林川'],['最后一班渡船','江屿'],['夜航来信','许南']];
const grid=document.querySelector('.grid'),pick=document.querySelector('.pick'),mobile=matchMedia('(max-width:740px)');
function choose(id){for(const s of grid.children)s.hidden=id!=='all'&&s.dataset.id!==id;grid.classList.toggle('single',id!=='all');for(const b of pick.children)b.setAttribute('aria-pressed',String(b.value===id))}
for(const [id,text] of [['all','全部'],...variants.map(v=>[v[0],v[0]+' 稿'])]){let b=document.createElement('button');b.value=id;b.textContent=text;b.onclick=()=>choose(id);pick.append(b)}
for(const [id,title,desc] of variants){const sample=document.createElement('section');sample.className='sample';sample.dataset.id=id;sample.innerHTML=`<header class="cap"><b>${id}</b><h2>${title}</h2><small>${desc}</small></header><div class="frame ${id.toLowerCase()}"><div class="head"><strong>小说书架</strong><small>剩余 3 次</small></div><form class="find"><input type="search" enterkeyhint="search" aria-label="${title}：书名或作者" placeholder="输入书名或作者"><button>搜索</button></form><div class="sectionline"><b></b><span></span></div><div class="list"></div><nav class="dest" aria-label="${title}导航"></nav></div>`;grid.append(sample);
let current='番茄';const form=sample.querySelector('form'),input=form.elements[0],nav=sample.querySelector('nav'),list=sample.querySelector('.list');
function render(){const file=current==='文件';const rows=books.filter(b=>file||b.join(' ').includes(input.value.trim()));sample.querySelector('.sectionline b').textContent=file?'我的文件':current+'书目';sample.querySelector('.sectionline span').textContent=rows.length+(file?' 个文件':' 本');for(const b of nav.children){if(b.textContent===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}form.hidden=file;form.style.display=file?'none':'';list.replaceChildren();for(const [name,author] of rows){const i=books.findIndex(b=>b[0]===name),n='0'+(i+1);const el=document.createElement('div');el.className='entry';el.innerHTML=(id==='C'?`<div class="binding" aria-hidden="true"><b>${name}</b><i>${n}</i></div>`:`<span class="serial">${id==='B'?(file?'文':'书'):n}</span>`)+`<div class="meta"><div class="name">${name}</div><div class="by">${author}${file?'　'+(i===1?'EPUB':'TXT'):''}</div></div>`+(id==='B'?`<span class="code">${n}</span>`:'');list.append(el)}if(!rows.length){const p=document.createElement('p');p.className='zero';p.textContent='没有匹配的示例书目。';list.append(p)}}
for(const tab of ['番茄','七猫','文件']){const b=document.createElement('button');b.textContent=tab;b.onclick=()=>{current=tab;input.value='';render()};nav.append(b)}form.onsubmit=e=>{e.preventDefault();input.blur();render()};input.onsearch=render;render()}
choose(mobile.matches?'A':'all');
</script></body></html>
