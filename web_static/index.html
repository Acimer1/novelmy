<!-- ═══════════════════════════════════════════════════
     模块 B/C/D/G 新增脚本（收藏/历史/预览/批量/阅读器/管理/通知/公告）
     ═══════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════
 * 通用工具 - 本地存储封装
 * ═══════════════════════════════════════════════════ */
const Store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); return true; } catch (e) { return false; } },
};

/* ═══════════════════════════════════════════════════
 * B3 搜索历史
 * ═══════════════════════════════════════════════════ */
const SearchHistory = {
  KEY: 'fanqie_search_history_v1',
  MAX: 12,
  list() { return Store.get(SearchHistory.KEY, []); },
  add(q) {
    if (!q || !q.trim()) return;
    let list = SearchHistory.list().filter(x => x !== q);
    list.unshift(q);
    Store.set(SearchHistory.KEY, list.slice(0, SearchHistory.MAX));
  },
  clear() { Store.del(SearchHistory.KEY); },
  remove(q) { Store.set(SearchHistory.KEY, SearchHistory.list().filter(x => x !== q)); },
  render(containerId, onPick) {
    const list = SearchHistory.list();
    const c = document.getElementById(containerId);
    if (!c) return;
    if (!list.length) { c.innerHTML = ''; c.style.display = 'none'; return; }
    c.style.display = 'block';
    c.innerHTML = `<div class="sh-title"><span>🔍 最近搜索</span><a style="cursor:pointer;color:var(--cyan2);font-size:.9em" onclick="SearchHistory.clear();SearchHistory.render('${containerId}',${onPick.name})">清空</a></div><div class="sh-list">${list.map(q => `<span class="sh-tag" onclick="(${onPick})('${eH(q).replace(/'/g, "\\'")}')">${eH(q)}</span>`).join('')}</div>`;
  },
};

/* ═══════════════════════════════════════════════════
 * G5 桌面通知
 * ═══════════════════════════════════════════════════ */
async function notify(title, body, icon) {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    new Notification(title, { body, icon: icon || '/favicon.ico' });
  } else if (Notification.permission !== 'denied') {
    const p = await Notification.requestPermission();
    if (p === 'granted') new Notification(title, { body, icon: icon || '/favicon.ico' });
  }
}
// 请求通知权限（用户首次进入后）
setTimeout(() => {
  if ('Notification' in window && Notification.permission === 'default') {
    // 不主动弹，等用户点了"启用通知"再请求
  }
}, 3000);

/* ═══════════════════════════════════════════════════
 * C5 公告/通知系统（管理员写 localStorage，普通用户读）
 * 渲染为顶部横幅（不弹窗），与首登引导独立
 * ═══════════════════════════════════════════════════ */
const Announce = {
  KEY: 'fanqie_announcement_v1',
  DISMISSED: 'fanqie_ann_dismissed_v1',
  get() { return Store.get(Announce.KEY, null); },
  set(d) { Store.set(Announce.KEY, d); Store.del(Announce.DISMISSED); },
  clear() { Store.del(Announce.KEY); },
  isDismissed() { return !!Store.get(Announce.DISMISSED, false); },
  dismiss() { Store.set(Announce.DISMISSED, true); },
  render() {
    const old = document.getElementById('globalAnnounce');
    if (old) old.remove();
    const data = Announce.get();
    if (!data || Announce.isDismissed()) return;
    const el = document.createElement('div');
    el.id = 'globalAnnounce';
    el.className = 'announce show';
    el.innerHTML = `<button class="ann-close" onclick="Announce.dismiss();this.parentElement.remove()">✕</button>
      <div class="ann-title">${eH(data.title || '系统公告')}</div>
      <div class="ann-body">${eH(data.body || '')}</div>`;
    // 插入到 app 顶部
    const app = document.getElementById('app');
    if (app && app.firstChild) app.insertBefore(el, app.firstChild);
  },
};
// 启动后渲染公告（如果有）
setTimeout(() => Announce.render(), 800);

/* ═══════════════════════════════════════════════════
 * F2 首登引导弹窗（每用户/每浏览器只弹一次）
 *  - 关闭后保留「指南」tab 红点，直到用户真正点开指南
 *  - 「去看指南」按钮：仅关闭弹窗，红点继续存在
 *  - 「我知道了」按钮：关闭弹窗 + 标记指南已读
 * ═══════════════════════════════════════════════════ */
const FirstLoginWelcome = {
  SEEN_KEY: 'fanqie_welcome_seen_v1',  // 弹窗是否被看过
  GUIDE_READ_KEY: 'fanqie_guide_read_v1',  // 指南 tab 是否被点过
  shouldShow() {
    // 仅在用户已登录、未看过弹窗时显示
    if (!U) return false;
    return !Store.get(FirstLoginWelcome.SEEN_KEY, false);
  },
  isGuideRead() {
    return !!Store.get(FirstLoginWelcome.GUIDE_READ_KEY, false);
  },
  show() {
    if (!FirstLoginWelcome.shouldShow()) return;
    // 防止重复弹
    if (document.getElementById('welcomeMask')) return;
    const username = (U && U.username) ? U.username : '读者';
    const isAdmin = U && U.is_admin;
    const mask = document.createElement('div');
    mask.id = 'welcomeMask';
    mask.className = 'welcome-mask';
    mask.innerHTML = `
      <div class="welcome-box" role="dialog" aria-modal="true">
        <div class="welcome-bg"></div>
        <div class="welcome-content">
          <div class="welcome-head">
            <div class="welcome-icon">👋</div>
            <div>
              <span class="welcome-badge">🎉 欢迎回来</span>
              <h2 class="welcome-title">欢迎，${eH(username)}！</h2>
            </div>
          </div>
          <p class="welcome-body">
            这是你的<b>番茄 · 七猫小说下载器</b>。<br>
            支持<b>链接下载</b>、<b>搜索下载</b>、<b>文件分割</b>、<b>收藏管理</b>和<b>在线阅读</b>。
          </p>
          <div class="welcome-tip">
            💡 <b>新手提示：</b>第一次使用？强烈建议花 3 分钟阅读 <b>「指南」</b> 标签页，了解下载次数、批量导入、文件分割等核心玩法，能少走很多弯路喵～
          </div>
          <div class="welcome-actions">
            <button class="welcome-btn welcome-btn-ghost" id="welcomeGotIt">我知道了</button>
            <button class="welcome-btn welcome-btn-primary" id="welcomeViewGuide">📖 去看看指南</button>
          </div>
          <div class="welcome-footnote">${isAdmin ? '管理员模式已激活 · 你拥有所有用户管理权限' : '每下载一本小说消耗 1 次下载次数 · 次数不足请联系管理员'}</div>
        </div>
      </div>`;
    document.body.appendChild(mask);

    // 关闭弹窗（仅关闭，不标记指南已读 → 保留红点）
    function close(alsoMarkGuideRead) {
      Store.set(FirstLoginWelcome.SEEN_KEY, true);
      if (alsoMarkGuideRead) Store.set(FirstLoginWelcome.GUIDE_READ_KEY, true);
      const m = document.getElementById('welcomeMask');
      if (m) {
        m.style.animation = 'welcome-fade .2s ease forwards';
        const box = m.querySelector('.welcome-box');
        if (box) box.style.animation = 'welcome-pop .2s cubic-bezier(.4,0,.6,1) reverse forwards';
        setTimeout(() => m.remove(), 220);
      }
      // 关闭后刷新红点（如果还没点过指南，应保留红点）
      FirstLoginWelcome.refreshBadge();
    }

    // 「我知道了」：关闭弹窗 + 标记指南已读（红点消失）
    document.getElementById('welcomeGotIt').onclick = () => close(true);
    // 「去看看指南」：关闭弹窗但保留红点
    document.getElementById('welcomeViewGuide').onclick = () => close(false);
    // 点遮罩关闭 = 等同于「我知道了」
    mask.addEventListener('click', (e) => { if (e.target === mask) close(true); });
    // ESC 关闭 = 等同于「我知道了」
    const escHandler = (e) => {
      if (e.key === 'Escape') {
        document.removeEventListener('keydown', escHandler);
        close(true);
      }
    };
    document.addEventListener('keydown', escHandler);
  },
  // 渲染/移除指南 tab 的红点 + 高亮徽章
  refreshBadge() {
    const guideBtn = document.getElementById('guideNavBtn');
    if (!guideBtn) return;
    // 红点（小红圆点）
    const oldDot = guideBtn.querySelector('.nav-badge');
    if (oldDot) oldDot.remove();
    // 「新」字徽章（更醒目）
    const oldText = guideBtn.querySelector('.nav-badge-text');
    if (!FirstLoginWelcome.isGuideRead()) {
      if (oldText) oldText.style.display = '';
      if (!oldText) {
        // 已在模板里写了 span，这里只补红点
        const dot = document.createElement('span');
        dot.className = 'nav-badge';
        dot.title = '新手必看';
        guideBtn.appendChild(dot);
      }
      // 给指南 tab 加 pulse 呼吸效果（高亮）
      guideBtn.classList.add('guide-nav-pulse');
      // 同步刷新主屏引导横条
      FirstLoginWelcome.refreshStrip();
    } else {
      if (oldText) oldText.style.display = 'none';
      guideBtn.classList.remove('guide-nav-pulse');
      // 已读：隐藏主屏引导横条
      const strip = document.getElementById('guideCtaStrip');
      if (strip) strip.style.display = 'none';
    }
  },
  // 主屏引导横条：未读且用户已登录且未主动关闭过 → 显示
  refreshStrip() {
    const strip = document.getElementById('guideCtaStrip');
    if (!strip) return;
    if (!U || FirstLoginWelcome.isGuideRead() || FirstLoginWelcome._stripDismissed()) {
      strip.style.display = 'none';
      return;
    }
    strip.style.display = '';
  },
  STRIP_DISMISS_KEY: 'fanqie_guide_strip_dismissed_v1',
  _stripDismissed() {
    return !!Store.get(FirstLoginWelcome.STRIP_DISMISS_KEY, false);
  },
  // 持久化关闭横条（不再打扰）
  dismissStrip() {
    Store.set(FirstLoginWelcome.STRIP_DISMISS_KEY, true);
    const strip = document.getElementById('guideCtaStrip');
    if (strip) strip.style.display = 'none';
  },
  // 用户点击了指南 tab
  markGuideRead() {
    Store.set(FirstLoginWelcome.GUIDE_READ_KEY, true);
    FirstLoginWelcome.refreshBadge();
  },
};

/* ═══════════════════════════════════════════════════
 * A3 主题切换（写入 Store + 应用 CSS 变量）
 * ═══════════════════════════════════════════════════ */
const Theme = {
  KEY: 'fanqie_theme_v1',
  cur: Store.get('fanqie_theme_v1', 'dark'),
  apply(t) {
    this.cur = t;
    Store.set(this.KEY, t);
    const r = document.documentElement.style;
    if (t === 'light') {
      r.setProperty('--bg', '#f4f5f8');
      r.setProperty('--bg-grad', 'linear-gradient(135deg,#e8eef7 0%,#dde6f1 100%)');
      r.setProperty('--surface', 'rgba(255,255,255,0.7)');
      r.setProperty('--surface-hover', 'rgba(255,255,255,0.85)');
      r.setProperty('--border', 'rgba(0,0,0,0.10)');
      r.setProperty('--text', '#1a1a1a');
      r.setProperty('--text2', '#3a3a3a');
      r.setProperty('--text3', '#888');
      r.setProperty('--card-bg', 'rgba(255,255,255,0.85)');
    } else {
      r.setProperty('--bg', '#0a0e1a');
      r.setProperty('--bg-grad', 'linear-gradient(135deg,#0a0e1a 0%,#0f1629 50%,#1a1530 100%)');
      r.setProperty('--surface', 'rgba(255,255,255,0.04)');
      r.setProperty('--surface-hover', 'rgba(255,255,255,0.07)');
      r.setProperty('--border', 'rgba(255,255,255,0.08)');
      r.setProperty('--text', '#fff');
      r.setProperty('--text2', 'rgba(255,255,255,0.7)');
      r.setProperty('--text3', 'rgba(255,255,255,0.4)');
      r.setProperty('--card-bg', 'rgba(255,255,255,0.04)');
    }
    document.body.classList.add('theme-transitioning');
    setTimeout(() => document.body.classList.remove('theme-transitioning'), 400);
  },
  toggle() { this.apply(this.cur === 'dark' ? 'light' : 'dark'); toast.info(`已切换到${this.cur === 'dark' ? '日间' : '夜间'}模式`); },
  inject() {
    if (document.getElementById('themeBtn')) return;
    const btn = document.createElement('button');
    btn.id = 'themeBtn';
    btn.className = 'theme-toggle';
    btn.title = '切换主题';
    btn.innerHTML = '🌓';
    btn.onclick = () => Theme.toggle();
    document.body.appendChild(btn);
  },
};
// 启动时应用
Theme.apply(Theme.cur);
setTimeout(() => Theme.inject(), 1000);

/* ═══════════════════════════════════════════════════
 * 管理员公告编辑（U.is_admin 时注入入口）
 * ═════════════════════════════════════════════════== */
function adminAnnounceEdit() {
  const cur = Announce.get() || { title: '', body: '' };
  const mask = document.createElement('div');
  mask.className = 'preview-mask show';
  mask.onclick = (e) => { if (e.target === mask) mask.remove(); };
  mask.innerHTML = `<div class="preview-box" onclick="event.stopPropagation()" style="max-width:520px">
    <div class="preview-head"><span style="font-size:1.1em">📢</span><span class="pv-title">编辑公告</span><button class="btn-xs btn-ghost" onclick="this.closest('.preview-mask').remove()">关闭</button></div>
    <div style="padding:18px">
      <input class="inp" id="annTitle" placeholder="公告标题" value="${eH(cur.title)}" style="margin-bottom:10px">
      <textarea class="inp url-area" id="annBody" rows="6" placeholder="公告内容...">${eH(cur.body)}</textarea>
      <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
        <button class="btn btn-red btn-sm" onclick="Announce.clear();this.closest('.preview-mask').remove();toast.info('公告已删除')">删除公告</button>
        <button class="btn btn-go btn-sm" onclick="Announce.set({title:document.getElementById('annTitle').value,body:document.getElementById('annBody').value,at:Date.now()});Announce.render();this.closest('.preview-mask').remove();toast.success('公告已发布')">发布</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(mask);
}

/* ═══════════════════════════════════════════════════
 * D1 管理员仪表盘（用户数据）
 * ═════════════════════════════════════════════════== */
async function renderAdminDashboard() {
  let users = [], files = [];
  try { const r = await api('/api/admin/users?page=1&per_page=1000'); const d = await r.json(); users = d.users || []; } catch (e) {}
  try { const r = await api('/api/files?page=1&per_page=1000'); const d = await r.json(); files = d.files || []; } catch (e) {}

  const totalUsers = users.length;
  const activeUsers = users.filter(u => (u.download_count || 0) > 0).length;
  const disabledUsers = users.filter(u => u.is_disabled).length;
  const totalDownloads = files.length;
  const totalSize = files.reduce((s, f) => s + (parseInt(f.size) || 0), 0);
  const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(2) + ' MB' : (b / 1024).toFixed(1) + ' KB';

  // 在线用户近似（最近 5 分钟活跃）
  // 简化：直接展示总下载数等
  document.getElementById('adminDashBody').innerHTML = `
<div class="dash-grid">
  <div class="dash-tile"><div class="dt-icon">👥</div><div class="dt-num count-up" data-v="${totalUsers}">${totalUsers}</div><div class="dt-label">总用户数</div></div>
  <div class="dash-tile green"><div class="dt-icon">✅</div><div class="dt-num">${activeUsers}</div><div class="dt-label">活跃用户</div></div>
  <div class="dash-tile red"><div class="dt-icon">🚫</div><div class="dt-num">${disabledUsers}</div><div class="dt-label">已禁用</div></div>
  <div class="dash-tile purple"><div class="dt-icon">📚</div><div class="dt-num">${totalDownloads}</div><div class="dt-label">总下载数</div></div>
  <div class="dash-tile amber"><div class="dt-icon">💾</div><div class="dt-num">${fmtSize(totalSize)}</div><div class="dt-label">累计体积</div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
  <div class="card">
    <div class="card-header">📊 用户下载排行 Top 10</div>
    <div class="bar-chart">${
      users.filter(u => !u.is_admin).sort((a, b) => (b.download_count || 0) - (a.download_count || 0)).slice(0, 10).map(u => {
        const v = u.download_count || 0;
        const max = Math.max(...users.map(x => x.download_count || 0), 1);
        return `<div class="bar-row"><span class="bar-name" title="${eH(u.username)}">${eH(u.username).slice(0, 8)}</span><div class="bar-track"><div class="bar-fill" style="width:${(v / max * 100)}%"></div></div><span class="bar-val">${v}</span></div>`;
      }).join('') || '<div style="color:var(--text3);text-align:center;padding:20px">暂无数据</div>'
    }</div>
  </div>
  <div class="card">
    <div class="card-header">📈 最近 7 天下载</div>
    <div class="trend-chart">${
      (() => {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const days = [];
        for (let i = 6; i >= 0; i--) days.push({ d: new Date(today.getTime() - i * 86400000), count: 0, label: (new Date(today.getTime() - i * 86400000).getMonth() + 1) + '/' + new Date(today.getTime() - i * 86400000).getDate() });
        files.forEach(f => {
          if (!f.mtime) return;
          let dt = null;
          if (typeof f.mtime === 'number') dt = new Date(f.mtime * 1000);
          else if (typeof f.mtime === 'string') { const n = f.mtime.replace(/-/g, '/'); dt = new Date(n); }
          if (!dt || isNaN(dt.getTime())) return;
          dt.setHours(0, 0, 0, 0);
          const day = days.find(x => x.d.getTime() === dt.getTime());
          if (day) day.count++;
        });
        const max = Math.max(1, ...days.map(d => d.count));
        return days.map(d => `<div class="trend-bar"><div class="tr"><div class="tr-fill" style="height:${(d.count / max * 100)}%" data-v="${d.count}"></div></div><div class="tr-label">${d.label}</div></div>`).join('');
      })()
    }</div>
  </div>
</div>
<div class="card" style="margin-top:14px">
  <div class="card-header">⚙️ 快捷操作</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <button class="btn btn-cyan btn-sm" onclick="adminAnnounceEdit()">📢 发布/编辑公告</button>
    <button class="btn btn-sm" onclick="if(confirm('确定要导出数据库快照？')){window.open('/api/admin/backup','_blank')};return false">💾 导出数据库</button>
    <button class="btn btn-sm" onclick="renderAdmin()">👥 用户管理</button>
    <button class="btn btn-sm" onclick="renderAdminDashboard()">🔄 刷新数据</button>
  </div>
</div>`;
  // 数字 count-up
  document.querySelectorAll('.count-up').forEach(el => {
    const v = parseInt(el.dataset.v) || 0;
    if (typeof countUp === 'function') countUp(el, v, 1000);
  });
}

 * 扩展 admin render - 增加仪表盘
