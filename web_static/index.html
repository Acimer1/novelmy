<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>欢迎使用</title>
<style>
:root{
  --bg:#0f0f1a;
  --surface:rgba(255,255,255,0.04);
  --surface-hover:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);
  --text:#e0e0e0;
  --text2:#999;
  --text3:#666;
  --orange:#ff6b35;
  --orange2:#ff8555;
  --cyan:#0ea5e9;
  --cyan2:#38bdf8;
  --red:#ef4444;
  --green:#22c55e;
  --radius:14px;
  --radius-sm:10px;
  --radius-xs:6px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:
    radial-gradient(1100px 520px at 12% -10%, rgba(255,107,53,0.10), transparent 60%),
    radial-gradient(900px 480px at 88% -5%, rgba(14,165,233,0.10), transparent 60%),
    linear-gradient(180deg,#0d0d1c 0%,#0b0b16 45%,#090913 100%);
  color:var(--text);
  min-height:100dvh;
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}

.container{max-width:1100px;margin:0 auto;padding:16px}
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.app-logo{
  font-size:1.4em;font-weight:800;white-space:nowrap;letter-spacing:.5px;
  background:linear-gradient(135deg,#ffffff 0%,#ffd7c2 45%,#ff9d6b 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.app-logo span{
  font-weight:500;font-size:.72em;margin-left:8px;
  background:linear-gradient(135deg,#7dd3fc,#38bdf8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

.user-bar{display:flex;align-items:center;gap:12px}
.user-avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange2));
  display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;
  box-shadow:0 4px 14px rgba(255,107,53,0.35);
}
.user-name-text{font-size:.9em;color:var(--text2);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quota-pill{
  padding:4px 14px;border-radius:20px;font-size:.78em;font-weight:600;
  background:linear-gradient(135deg,var(--cyan),#0284c7);color:#fff;white-space:nowrap;
}
.quota-pill.low{background:linear-gradient(135deg,var(--red),#dc2626)}
/* 增加次数提示横幅 */
.quota-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:11px 16px;margin-bottom:16px;border-radius:var(--radius-sm);
  background:rgba(234,179,8,0.10);border:1px solid rgba(234,179,8,0.35);font-size:.9em;
}
.quota-banner .banner-text{color:var(--text);display:flex;align-items:center;gap:8px}
.quota-banner .banner-text .bell{font-size:1.05em}
/* 联系管理员弹窗 */
.contact-mask{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);
}
.contact-mask.show{display:flex}
.contact-box{
  width:min(420px,90vw);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.contact-box h3{margin:0 0 16px;font-size:1.05em}
.contact-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;margin-bottom:10px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:.92em;
}
.contact-row .contact-val{font-family:Consolas,monospace;color:var(--cyan);word-break:break-all}
.contact-row button{flex-shrink:0}
.contact-note{font-size:.78em;color:var(--text3);margin:4px 0 14px}
.btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--text2);
  padding:6px 16px;border-radius:20px;cursor:pointer;font-size:.8em;transition:.2s;
}
.btn-ghost:hover{color:#fff;border-color:var(--text2)}

.nav-bar{
  display:flex;gap:2px;margin-bottom:18px;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius);
  padding:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 6px 24px rgba(0,0,0,0.25);
}
.nav-btn{
  flex:1;min-width:80px;padding:10px 8px;border:none;background:transparent;
  color:var(--text3);cursor:pointer;font-size:.88em;border-radius:11px;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
}
.nav-btn:hover{color:var(--text2)}
.nav-btn.on{
  background:linear-gradient(135deg,rgba(255,107,53,0.20),rgba(255,107,53,0.10));
  color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,107,53,0.28);
}
.nav-btn .nav-icon{font-size:1.1em}

.section{display:none}
.section.active{display:block}
.card{
  background:linear-gradient(165deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.09);border-radius:var(--radius);
  padding:20px;margin-bottom:14px;transition:.2s;
  box-shadow:0 10px 36px rgba(0,0,0,0.35);
}
.card:hover{border-color:rgba(255,255,255,0.14)}
.card-header{font-size:.95em;font-weight:600;margin-bottom:14px;color:var(--text)}

.inp-row{display:flex;gap:10px;margin-bottom:10px}
.inp{
  flex:1;padding:11px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:rgba(0,0,0,0.35);color:#fff;font-size:.9em;outline:none;transition:.2s;
  min-width:0;
}
.inp:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,53,0.14),0 0 20px rgba(255,107,53,0.10)}
.inp::placeholder{color:var(--text3)}

.btn{
  padding:10px 22px;border:none;border-radius:var(--radius-sm);cursor:pointer;
  font-size:.9em;font-weight:600;transition:.2s;white-space:nowrap;
}
.btn-go{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;box-shadow:0 6px 20px rgba(255,107,53,0.28)}
.btn-go:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 28px rgba(255,107,53,0.42)}
.btn-go:disabled{background:#444;color:#888;cursor:not-allowed;transform:none;filter:none;box-shadow:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#fff;box-shadow:0 6px 20px rgba(14,165,233,0.26)}
.btn-cyan:hover{filter:brightness(1.08);box-shadow:0 8px 28px rgba(14,165,233,0.4)}
.btn-cyan:disabled{background:#444;color:#888;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:7px 16px;font-size:.82em;border-radius:var(--radius-xs)}
.btn-outline{
  background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 18px;border-radius:var(--radius-sm);cursor:pointer;font-size:.85em;
}
.btn-outline:hover{border-color:var(--orange);color:var(--orange)}

.subtabs{display:flex;gap:0;margin-bottom:14px}
.subtab{
  padding:7px 18px;cursor:pointer;color:var(--text3);font-size:.82em;
  border-bottom:2px solid transparent;transition:.2s;
}
.subtab.on{color:var(--orange);border-bottom-color:var(--orange)}

.progress-wrap{display:none;margin-top:12px}
.progress-wrap.show{display:block}
.progress-bar{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:3px;transition:width .4s ease}
.progress-bar .fill.cyan{background:linear-gradient(90deg,var(--cyan),var(--cyan2))}
.progress-label{font-size:.82em;color:var(--text2);display:flex;justify-content:space-between}

.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.book-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:.2s;position:relative;
}
.book-card:hover{background:var(--surface-hover);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,0.45),0 0 0 1px rgba(255,107,53,0.15)}
.book-card-img{
  width:100%;aspect-ratio:2/3;object-fit:cover;background:rgba(0,0,0,0.3);
  display:flex;align-items:center;justify-content:center;font-size:2em;color:var(--text3);
}
.book-card-body{padding:10px 12px}
.book-card-title{font-size:.85em;font-weight:600;margin-bottom:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.book-card-meta{font-size:.72em;color:var(--text3)}

/* Book detail */
.book-hero{display:flex;gap:20px;margin-bottom:18px}
.book-cover{width:120px;min-width:120px;border-radius:var(--radius);aspect-ratio:2/3;object-fit:cover;background:rgba(0,0,0,0.3)}
.book-meta h3{font-size:1.15em;margin-bottom:6px}
.book-meta .info-line{font-size:.82em;color:var(--text2);margin-bottom:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{padding:3px 10px;border-radius:12px;font-size:.72em;font-weight:600}
.tag-orange{background:rgba(255,107,53,0.15);color:var(--orange2)}
.tag-cyan{background:rgba(14,165,233,0.15);color:var(--cyan2)}
.tag-green{background:rgba(34,197,94,0.15);color:var(--green)}
.pitch{font-size:.84em;color:var(--text3);line-height:1.7;margin-bottom:16px}
.fmt-pick{display:flex;gap:8px;margin-bottom:14px}
.fmt-opt{
  padding:8px 20px;border-radius:var(--radius-xs);border:1px solid var(--border);
  background:transparent;color:var(--text2);cursor:pointer;font-size:.84em;transition:.2s;
}
.fmt-opt:hover{border-color:var(--orange);color:var(--orange2)}
.fmt-opt.sel{background:rgba(255,107,53,0.12);border-color:var(--orange);color:var(--orange2)}
.fmt-opt.sel-cyan{background:rgba(14,165,233,0.12);border-color:var(--cyan);color:var(--cyan2)}
.fmt-opt.cyan-hover:hover{border-color:var(--cyan);color:var(--cyan2)}

.file-row{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-radius:var(--radius-sm);background:var(--surface);margin-bottom:8px;transition:.15s;
}
.file-row:hover{background:var(--surface-hover)}
.file-row .info{flex:1;min-width:0}
.file-row .info .name{font-size:.9em;font-weight:600;margin-bottom:3px}
.file-row .info .meta{font-size:.78em;color:var(--text3)}
.file-row .dl{
  color:var(--orange);text-decoration:none;font-size:.82em;font-weight:600;
  padding:8px 18px;border:1px solid rgba(255,107,53,0.3);border-radius:var(--radius-xs);transition:.2s;
}
.file-row .dl:hover{background:rgba(255,107,53,0.12)}
.src-badge{
  display:inline-block;padding:2px 8px;border-radius:8px;font-size:.68em;font-weight:700;margin-left:6px;
}
.src-fanqie{background:rgba(255,107,53,0.15);color:var(--orange)}
.src-qimao{background:rgba(14,165,233,0.15);color:var(--cyan2)}

.auth-box{max-width:400px;margin:40px auto}
.auth-box h2{
  text-align:center;margin-bottom:24px;font-size:1.7em;font-weight:800;letter-spacing:1px;
  background:linear-gradient(135deg,#ffffff,#ffb199);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.auth-switch{display:flex;margin-bottom:20px;background:var(--surface);border-radius:var(--radius-sm);padding:4px}
.auth-switch-btn{flex:1;padding:10px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:9px;font-size:.9em;transition:.2s}
.auth-switch-btn.on{background:rgba(255,255,255,0.08);color:#fff;font-weight:600}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form .btn-go{padding:12px}
.auth-msg{font-size:.84em;text-align:center;min-height:20px}
.auth-msg.err{color:var(--red)}
.auth-msg.ok{color:var(--green)}

.tbl{width:100%;border-collapse:collapse;font-size:.82em}
.tbl th,.tbl td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
.tbl th{color:var(--text3);font-weight:500}
.quota-inp{width:54px;padding:5px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:#fff;text-align:center;font-size:.82em}
.btn-xs{padding:5px 12px;font-size:.74em;border-radius:6px;border:none;cursor:pointer;font-weight:600}
.btn-red{background:var(--red);color:#fff}

.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .icon{font-size:3em;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:.9em}

/* ── 通用分页条 ── */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:16px}
.pg-btn{min-width:32px;padding:6px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:.82em;cursor:pointer;transition:.2s}
.pg-btn:hover:not(:disabled){color:#fff;border-color:var(--orange);transform:translateY(-1px)}
.pg-btn.on{background:rgba(255,107,53,.16);border-color:var(--orange);color:var(--orange2);font-weight:600;box-shadow:0 0 14px rgba(255,107,53,.15)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.pg-dots{color:var(--text3);padding:0 2px}
.pg-info{font-size:.76em;color:var(--text3);margin-left:8px;white-space:nowrap}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#1a1a2e;border:1px solid var(--border);border-radius:var(--radius);max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:24px}

.back-row{display:none;margin-bottom:10px}

/* Detail page download section */
.dl-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

@media (max-width:640px){
  .container{padding:12px}
  .app-header{font-size:.9em}
  .app-logo{font-size:1.15em}
  .nav-btn{font-size:.8em;padding:8px 6px}
  .nav-btn .nav-icon{font-size:1em}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .book-hero{flex-direction:column;align-items:center;text-align:center}
  .book-cover{width:100px;min-width:100px}
  .inp-row{flex-direction:column}
  .btn{width:100%}
  .btn-sm{width:auto}
  .card{padding:14px}
  /* 文件行：手机端紧凑排版，避免按钮溢出 */
  .file-row{padding:10px 12px}
  .file-row .file-header{flex-direction:column;align-items:stretch;gap:8px}
  .file-row .file-header .info{flex:1 1 auto;min-width:0}
  .file-row .file-header .actions{flex-wrap:wrap;gap:6px;width:100%}
  .file-row .file-header .actions .btn-xs,
  .file-row .file-header .actions .dl{
    flex:1 1 auto;text-align:center;padding:6px 8px;font-size:.78em;
    min-width:0;white-space:nowrap;
  }
  .file-row .file-header .actions .dl{padding:6px 10px}
  .file-row .name{font-size:.86em}
  .file-row .meta{font-size:.72em}
  .tbl{font-size:.72em}
  .back-row{display:block}
  .hide-mobile{display:none!important}
}
@media (min-width:641px){
  .show-mobile{display:none!important}
}

/* ===== 小说分割功能 ===== */
.file-row{cursor:pointer;flex-wrap:wrap}
.file-row .file-header{
  display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;
}
.file-row .file-header .info{flex:1;min-width:0}
.file-row .file-header .actions{display:flex;gap:8px;flex-shrink:0}
.split-panel{
  width:100%;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
  display:none;
}
.file-row.open .split-panel{display:block}
.split-settings{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;
}
.split-settings .split-item label{
  display:block;font-size:.78em;color:var(--text3);margin-bottom:4px;
}
.split-settings .split-item select,
.split-settings .split-item input{
  width:100%;padding:8px 10px;border-radius:var(--radius-xs);
  border:1px solid var(--border);background:rgba(0,0,0,0.3);
  color:#fff;font-size:.82em;outline:none;
}
.split-settings .split-item select:focus,
.split-settings .split-item input:focus{border-color:var(--orange)}
.split-btn{
  background:linear-gradient(135deg,var(--cyan),#0284c7);color:#fff;
  border:none;padding:8px 16px;border-radius:var(--radius-xs);
  font-size:.82em;font-weight:600;cursor:pointer;transition:.2s;
}
.split-btn:hover{filter:brightness(1.1)}
.split-btn:disabled{opacity:.5;cursor:not-allowed}
.split-progress-box{
  margin-top:10px;padding:10px;background:rgba(0,0,0,0.3);
  border-radius:var(--radius-xs);display:none;
}
.split-progress-box.active{display:block}
.split-progress-bar{
  width:100%;height:6px;background:rgba(255,255,255,0.1);
  border-radius:3px;overflow:hidden;margin:6px 0;
}
.split-progress-fill{
  height:100%;background:linear-gradient(90deg,var(--cyan),var(--orange));
  width:0%;border-radius:3px;transition:width .3s;
}
.split-progress-text{font-size:.78em;color:var(--text3);display:flex;justify-content:space-between}
.split-output-list{
  margin-top:10px;max-height:200px;overflow-y:auto;
}
.split-output-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;background:rgba(14,165,233,0.08);
  border:1px solid rgba(14,165,233,0.2);border-radius:var(--radius-xs);
  margin-bottom:6px;font-size:.8em;
}
.split-output-item .fname{font-family:monospace;font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:8px}
.split-output-item .fsize{color:var(--text3);font-size:.78em;margin-right:8px;flex-shrink:0}
.split-output-item .fdl{
  color:var(--cyan2);text-decoration:none;font-size:.78em;font-weight:600;
  padding:4px 10px;border:1px solid rgba(14,165,233,0.3);border-radius:4px;flex-shrink:0;
}
.split-output-item .fdl:hover{background:rgba(14,165,233,0.1)}
.split-dl-all{
  margin-top:8px;font-size:.78em;color:var(--cyan2);text-decoration:none;
}
@media (max-width:640px){
  .split-settings{grid-template-columns:1fr 1fr}
  .split-output-item .fname{font-size:.75em}
}

/* ============ 美学增强 v2：深空玻璃拟态 ============ */
:root{
  --glow-orange:0 8px 28px rgba(255,107,53,.40);
  --glow-cyan:0 8px 28px rgba(14,165,233,.40);
  --ring-focus:0 0 0 3px rgba(255,107,53,.16), 0 0 26px rgba(255,107,53,.14);
  --glass:rgba(255,255,255,.055);
}

/* ── 背景：光晕 + 星点 + 细网格 ── */
body{
  background:
    radial-gradient(1200px 620px at 12% -12%, rgba(255,107,53,.16), transparent 55%),
    radial-gradient(1000px 540px at 88% -6%, rgba(14,165,233,.17), transparent 55%),
    radial-gradient(900px 520px at 50% 118%, rgba(139,92,246,.09), transparent 60%),
    linear-gradient(180deg,#0e0e20 0%,#0a0a19 50%,#080814 100%);
  background-attachment:fixed;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, rgba(255,255,255,.55), transparent 100%),
    radial-gradient(1px 1px at 28% 64%, rgba(255,255,255,.4), transparent 100%),
    radial-gradient(1.6px 1.6px at 42% 12%, rgba(255,214,180,.5), transparent 100%),
    radial-gradient(1px 1px at 58% 40%, rgba(255,255,255,.35), transparent 100%),
    radial-gradient(1.3px 1.3px at 72% 74%, rgba(125,211,252,.5), transparent 100%),
    radial-gradient(1px 1px at 86% 26%, rgba(255,255,255,.42), transparent 100%),
    radial-gradient(1.5px 1.5px at 94% 62%, rgba(255,214,180,.42), transparent 100%),
    radial-gradient(1px 1px at 64% 88%, rgba(255,255,255,.3), transparent 100%);
  background-size:320px 320px;

<script>
/* ═══════════════════════════════════════════════════
 * effects.js - 全局微动效
 *  - 按钮波纹（自动绑定 .btn 类）
 *  - 卡片 3D 倾斜（自动绑定 .tilt-card）
 *  - 数字 count-up
 *  - 滚动指示器
 *  - 错误抖动
 * ═══════════════════════════════════════════════════ */
(function (global) {
  'use strict';

  // ── 按钮波纹 ──
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn, .btn-sm, .btn-xs, .btn-go, .btn-cyan, .btn-outline, .btn-ghost, .btn-red, .split-btn, .fmt-opt, .nav-btn, .subtab, .pg-btn, .confirm-btn');
    if (!btn) return;
    if (btn._rippling) return;
    btn._rippling = true;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.2;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    if (getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
    if (getComputedStyle(btn).overflow !== 'hidden') btn.style.overflow = 'hidden';
    btn.appendChild(ripple);
    setTimeout(() => { ripple.remove(); btn._rippling = false; }, 700);
  });

  // ── 卡片 3D 倾斜 ── */
  function attachTilt(el) {
    if (el.dataset.tilt === '1') return;
    el.dataset.tilt = '1';
    const max = 4;
    el.addEventListener('mousemove', (e) => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(1000px) rotateX(${-y * max}deg) rotateY(${x * max}deg) translateY(-2px) scale(1.01)`;
    });
    el.addEventListener('mouseleave', () => {
      el.style.transform = '';
    });
  }

  function scanTilt() {
    document.querySelectorAll('.tilt-card').forEach(attachTilt);
  }

  // 定时扫描新增卡片
  setInterval(scanTilt, 1000);

  // ── 数字 count-up ──
  function countUp(el, target, duration) {
    duration = duration || 1200;
    const start = parseFloat(el.textContent.replace(/,/g, '')) || 0;
    const t0 = performance.now();
    function tick(t) {
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = start + (target - start) * eased;
      el.textContent = Math.floor(val).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = target.toLocaleString();
    }
    requestAnimationFrame(tick);
  }

  global.countUp = countUp;
  global.scanTilt = scanTilt;

  // ── 滚动指示器（首屏提示） ──
  function setupScrollHint() {
    if (document.querySelector('.scroll-hint')) return;
    const hint = document.createElement('div');
    hint.className = 'scroll-hint';
    document.body.appendChild(hint);
    function check() {
      if (window.scrollY > 80) hint.classList.remove('show');
      else if (document.body.scrollHeight > window.innerHeight + 200) hint.classList.add('show');
      else hint.classList.remove('show');
    }
    window.addEventListener('scroll', check, { passive: true });
    window.addEventListener('resize', check);
    setTimeout(check, 500);
  }
  setTimeout(setupScrollHint, 1500);

  // ── 错误抖动辅助 ──
  global.shakeElement = function (el) {
    if (!el) return;
    el.classList.remove('shake-on-error');
    void el.offsetWidth;
    el.classList.add('shake-on-error');
    setTimeout(() => el.classList.remove('shake-on-error'), 500);
  };

  // ── 成功/错误脉冲 ──
  global.pulseSuccess = function (el) {
    if (!el) return;
    el.classList.remove('pulse-success');
    void el.offsetWidth;
    el.classList.add('pulse-success');
    setTimeout(() => el.classList.remove('pulse-success'), 700);
  };
  global.pulseError = function (el) {
    if (!el) return;
    el.classList.remove('pulse-error');
    void el.offsetWidth;
    el.classList.add('pulse-error');
    setTimeout(() => el.classList.remove('pulse-error'), 700);
  };
})(window);
</script>

<!-- === 主题切换 + 粒子背景 + 标签切换过渡 === -->
<script>
/* ═══════════════════════════════════════════════════
 * theme.js + particles.js + tab transition
 * ═══════════════════════════════════════════════════ */
(function () {
  'use strict';

  // ── 主题：读取/保存/应用 ──
  const KEY = 'fnd_theme';
  function getTheme() { return localStorage.getItem(KEY) || 'dark'; }
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(KEY, theme);
    const btn = document.querySelector('.theme-toggle');
    if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
  function toggleTheme() {
    const cur = getTheme();
    document.documentElement.classList.add('theme-transitioning');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
    setTimeout(() => document.documentElement.classList.remove('theme-transitioning'), 500);
  }
  window.toggleTheme = toggleTheme;
  // 立即应用主题避免闪烁
  applyTheme(getTheme());

  // ── 粒子背景（仅登录页） ──
  function renderParticles() {
    if (document.querySelector('.particle-bg')) return;
    const bg = document.createElement('div');
    bg.className = 'particle-bg';
    const colors = ['#ff6b35', '#0ea5e9', '#9ad9ff', '#ffb08f', '#a78bfa', '#f59e0b'];
    const count = window.innerWidth < 640 ? 18 : 36;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 3 + Math.random() * 6;
      p.style.width = p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
      p.style.setProperty('--dy', (Math.random() - 0.5) * 200 + 'px');
      p.style.animationDelay = Math.random() * 12 + 's';
      p.style.animationDuration = (10 + Math.random() * 8) + 's';
      bg.appendChild(p);
    }
    document.body.appendChild(bg);
  }

  // ── 浮动主题按钮 ──
  function renderThemeToggle() {
    if (document.querySelector('.theme-toggle')) return;
    const btn = document.createElement('button');
    btn.className = 'theme-toggle';
    btn.title = '切换主题';
    btn.setAttribute('aria-label', '切换主题');
    btn.textContent = getTheme() === 'dark' ? '☀️' : '🌙';
    btn.addEventListener('click', toggleTheme);
    document.body.appendChild(btn);
  }

  // 首次加载即初始化
  renderThemeToggle();

  // 检测登录页（无 user 时）显示粒子
  window._showParticles = renderParticles;
  window._hideParticles = function () {
    const bg = document.querySelector('.particle-bg');
    if (bg) bg.remove();
  };
})();

/* ── 标签切换：增强过渡 ── */
(function () {
  // 包装 switchTab 让其有 leaving 阶段
  const origSwitch = window.switchTab;
  if (!origSwitch) {
    // 第一次执行时尚未定义，等到 boot 后再 hook
    document.addEventListener('DOMContentLoaded', () => {
      hookSwitchTab();
    });
  } else {
    hookSwitchTab();
  }
  function hookSwitchTab() {
    const orig = window.switchTab;
    if (orig._hooked) return;
    window.switchTab = function (t) {
      const cur = document.querySelector('.section.active');
      if (cur) {
        cur.classList.add('leaving');
        setTimeout(() => cur.classList.remove('leaving'), 400);
      }
      setTimeout(() => orig.call(this, t), 50);
    };
    window.switchTab._hooked = true;
  }
})();
</script>

let pgSeq=0;
// opts: {total, page, per_page, onPage}；挂到指定容器；totalPages<=1 时清空隐藏
function renderPagination(el,opts){
  if(!el)return;
  el._pgOpts=opts;
  const totalPages=Math.max(1,Math.ceil((opts.total||0)/(opts.per_page||20)));
  const page=Math.max(1,Math.min(opts.page||1,totalPages));
  if(totalPages<=1){el.innerHTML='';return}
  if(!el.id)el.id='pg'+(++pgSeq);
  const id=el.id;
  const pgBtn=p=>`<button class="pg-btn ${p===page?'on':''}" onclick="pgGo('${id}',${p})">${p}</button>`;
  const dots='<span class="pg-dots">…</span>';
  const win=2,arr=[];
  for(let p=1;p<=totalPages;p++){
    if(p===1||p===totalPages||Math.abs(p-page)<=win)arr.push(p);
    else if(arr[arr.length-1]!==0)arr.push(0);
  }
  el.innerHTML=
    '<div class="pager">'+
    `<button class="pg-btn" ${page<=1?'disabled':''} onclick="pgGo('${id}',${page-1})">‹ 上一页</button>`+
    arr.map(p=>p===0?dots:pgBtn(p)).join('')+
    `<button class="pg-btn" ${page>=totalPages?'disabled':''} onclick="pgGo('${id}',${page+1})">下一页 ›</button>`+
    `<span class="pg-info">共 ${opts.total} 条 · ${totalPages} 页</span>`+
    '</div>';
}

/* -- Fanqie download (from detail or link) -- */
// 等待番茄下载任务完成（返回 'ok'|'fail'）
// 找不到 job 时继续轮询（避免任务刚创建还没进列表就被误判完成）；
// 轮询超时仍未出现则视为完成（后端已占位写库兜底，不会丢记录）
async function fWaitJob(jobId,bookName){
  for(let k=0;k<150;k++){
    await new Promise(r=>setTimeout(r,2000));
    try{
      const jr=await api('/api/jobs');const jd=await jr.json();const items=jd.items||[];
      const job=items.find(j=>j.id===jobId)||items.find(j=>j.book_name===bookName);
      if(job&&job.status==='done')return 'ok';
      if(job&&(job.status==='failed'||job.status==='error'))return 'fail';
    }catch(e){}
  }
  return 'ok';
}

async function fLinkDownload(){
  const urlEl=document.getElementById('fUrl');
  const text=urlEl?urlEl.value.trim():'';
  if(!text){toast.warning('请输入小说链接');return}
  const links=text.split('\n').map(s=>s.trim()).filter(Boolean);
  const _isAdmin = U && U.is_admin;
  if(!_isAdmin && U.download_quota<=0){toast.warning('下载次数不足，请联系管理员');return}
  if(!_isAdmin && links.length>U.download_quota){toast.warning(`共 ${links.length} 条，但下载次数仅剩 ${U.download_quota} 次，请先联系管理员补充`);return}
  const btn=document.getElementById('fDlBtn');
  const prog=document.getElementById('fProg'),fill=document.getElementById('fFill'),label=document.getElementById('fLabel');
  if(btn){btn.disabled=true;btn.textContent='批量下载中...'}
  prog.classList.add('show');fill.style.width='2%';
  let ok=0,fail=0,firstErr='';
  label.textContent=`共 ${links.length} 条，开始逐条下载...`;
  for(let i=0;i<links.length;i++){
    const url=links[i];
    label.textContent=`正在下载 (${i+1}/${links.length})：${url.length>42?url.slice(0,42)+'…':url}`;
    fill.style.width=(2+(i*70/links.length))+'%';
    try{
      const r=await api('/api/download',{method:'POST',body:{url:url,format:fFmt}});
      const d=await r.json();
      if(d.error){fail++;if(!firstErr)firstErr=d.error;label.textContent=`✗ (${i+1}/${links.length}) ${d.error}`}
      else{
        if(d.quota!==undefined){U.download_quota=d.quota;updateQuotaUI()}
        let resOk=false;
        if(d.status==='done'||!d.job_id){resOk=true}
        else{
          const res=await fWaitJob(d.job_id,d.book_name);
          resOk=(res==='ok');
        }
        if(resOk){
          await fRecordDownload(d);
          ok++;label.textContent=`✓ (${i+1}/${links.length}) ${d.book_name||'下载成功'}`
        }
        else{fail++;if(!firstErr)firstErr='下载任务失败';label.textContent=`✗ (${i+1}/${links.length}) 任务失败`}
      }
    }catch(e){fail++;if(!firstErr)firstErr='网络错误或超时'}
  }
  fill.style.width='100%';
  label.textContent=`✅ 批量完成！成功 ${ok} 本，失败 ${fail} 本${fail&&firstErr?`（首错：${firstErr}）`:''}`;
  if(btn){btn.disabled=false;btn.textContent='开始下载'}
  setTimeout(()=>{const p=document.getElementById('fProg');if(p)p.classList.remove('show');if(btn)btn.textContent='开始下载 '+fFmt.toUpperCase();refreshQuota()},5000);
}

async function fStartDownload(){
  if(!fBook)return;
  const _isAdmin = U && U.is_admin;
  if(!_isAdmin && U.download_quota<=0){toast.warning('下载次数不足，请联系管理员');return}
  if(!await confirmDialog({title:'下载确认',message:`下载《${fBook.book_name||fBook.title||'未知'}》(${fFmt.toUpperCase()})？${_isAdmin?'管理员模式不消耗次数':'消耗1次下载次数'}`,okText:'开始下载'}))return;
  await fDoDownload(fBook.book_id||fBook.id,null);
}

let fPending=null;
async function fDoDownload(bookId,url){
  if(pT){clearInterval(pT);pT=null}
  const btn=document.getElementById('fDlBtn');
  const prog=document.getElementById('fProg'),fill=document.getElementById('fFill'),label=document.getElementById('fLabel');
  prog.classList.add('show');fill.style.width='5%';label.textContent='创建下载任务...';
  if(btn){btn.disabled=true;btn.textContent='下载中...'}
  fPending=null;

  try{
    const body=bookId?{book_id:bookId,format:fFmt}:{url:url,format:fFmt};
    const r=await api('/api/download',{method:'POST',body});const d=await r.json();
    if(d.error){label.textContent='✗ '+d.error;if(btn){btn.disabled=false;btn.textContent='开始下载 '+fFmt.toUpperCase()};return}
    if(d.quota!==undefined){U.download_quota=d.quota;updateQuotaUI()}
    fPending={book_name:d.book_name,author:d.author,book_id:d.book_id,file_name:d.book_name+' - '+d.author+'.'+fFmt};
    if(d.status==='done'){fFinishDownload();return}
    const jid=d.job_id;fill.style.width='10%';label.textContent='下载中... 0%';
    pT=setInterval(async()=>{
      try{
        const jr=await api('/api/jobs');const jd=await jr.json();const items=jd.items||[];
        const job=items.find(j=>j.id===jid)||items.find(j=>j.book_id===d.book_id);
        if(!job){fFinishDownload();return}
        if(job.status==='done'){fFinishDownload();return}
        if(job.status==='failed'||job.status==='error'){label.textContent='✗ '+(job.message||'下载失败');clearInterval(pT);pT=null;if(btn){btn.disabled=false;btn.textContent='开始下载 '+fFmt.toUpperCase()};return}
        const pct=Math.floor(job.progress||0);fill.style.width=pct+'%';label.textContent='下载中... '+pct+'%';
      }catch(e){}
    },2000);
    setTimeout(()=>{if(pT){clearInterval(pT);pT=null;if(btn){btn.disabled=false;btn.textContent='开始下载 '+fFmt.toUpperCase()}}},600000);
  }catch(e){label.textContent='✗ 网络错误';if(btn){btn.disabled=false;btn.textContent='开始下载 '+fFmt.toUpperCase()}}
}

// 下载成功后写库（幂等；失败静默，后端 api_download 已占位写库兜底）
async function fRecordDownload(d){
  if(!d||!d.book_name)return;
  const fn=d.file_name||(d.book_name+(d.author?' - '+d.author:'')+'.'+fFmt);
  try{await api('/api/finish_download',{method:'POST',body:{book_name:d.book_name,author:d.author||'',book_id:d.book_id||'',file_name:fn}})}catch(e){}
}

async function fFinishDownload(){
  const fill=document.getElementById('fFill'),label=document.getElementById('fLabel'),btn=document.getElementById('fDlBtn');
  if(fill)fill.style.width='100%';
  if(label)label.textContent='✓ 下载完成: '+ (fPending?fPending.book_name:'');
  if(pT){clearInterval(pT);pT=null}
  if(btn){btn.disabled=false;btn.textContent='开始下载 '+fFmt.toUpperCase()}
  if(fPending){await fRecordDownload(fPending)}
  setTimeout(()=>{const p=document.getElementById('fProg');if(p)p.classList.remove('show');refreshQuota()},2000);
  fPending=null;
}

async function qDownload(){

  const _isAdmin = U && U.is_admin;
  if(!_isAdmin && U.download_quota<=0){toast.warning('下载次数不足，请联系管理员');return}
  if(!await confirmDialog({title:'下载确认',message:`下载《${qBook.title||'未知'}》(${qFmt.toUpperCase()})？${_isAdmin?'管理员模式不消耗次数':'消耗1次下载次数'}`,okText:'开始下载'}))return;

  qBusy=true;const b=qBook;
  const prog=document.getElementById('qProg'),fill=document.getElementById('qFill'),label=document.getElementById('qLabel'),btn=document.getElementById('qDlBtn');
  prog.classList.add('show');fill.style.width='2%';label.textContent='正在连接...';
  btn.disabled=true;btn.textContent='下载中...';

  try{
    const r=await api('/api/qimao/download',{method:'POST',body:{book_id:b.id,book_name:b.title,author:b.author,format:qFmt}});
    const d=await r.json();
    if(d.error){label.textContent='✗ '+d.error;btn.disabled=false;btn.textContent='开始下载 '+qFmt.toUpperCase();qBusy=false;return}
    fill.style.width='100%';label.textContent=`✓ 完成! ${d.file_name} (${(d.file_size/1024).toFixed(1)}KB)`;
    U.download_quota=d.quota;updateQuotaUI();btn.textContent='下载完成 ✓';
  }catch(e){label.textContent='✗ 网络错误或超时';btn.disabled=false;btn.textContent='开始下载 '+qFmt.toUpperCase()}
  finally{qBusy=false;setTimeout(()=>{prog.classList.remove('show');if(btn)btn.textContent='开始下载 '+qFmt.toUpperCase()},6000)}
}

// 分割任务状态（按文件名存储）
const splitTasks={};
// 主服务的 token（同源共享 localStorage）
function _splitToken(){return localStorage.getItem('token')||''}

// 调用主服务分割 API
async function splitApi(url,opts={}){
  const token=_splitToken();
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  if(token)headers['Authorization']='Bearer '+token;
  const r=await fetch(url,{...opts,headers,body:opts.body?JSON.stringify(opts.body):undefined});
  return r;
}

// 开始分割
async function startSplit(bookName){
  const sizeInput=document.getElementById('split-size-'+encodeURIComponent(bookName));
  const btn=document.getElementById('split-btn-'+encodeURIComponent(bookName));
  const progBox=document.getElementById('split-prog-'+encodeURIComponent(bookName));
  const outList=document.getElementById('split-output-'+encodeURIComponent(bookName));
  const progFill=document.getElementById('split-fill-'+encodeURIComponent(bookName));
  const progText=document.getElementById('split-text-'+encodeURIComponent(bookName));

  const chunkMB=parseFloat(sizeInput.value);

  if(!chunkMB||chunkMB<0.5||chunkMB>50){toast.warning('请输入有效的分块大小（0.5~50 MB）');return}
  const _isAdmin = U && U.is_admin;
  if(!_isAdmin && U.download_quota<=0){toast.warning('下载次数不足，无法分割，请联系管理员');return}
  if(!await confirmDialog({title:'分割确认',message:`分割《${bookName}》${_isAdmin?'(管理员模式不消耗次数)':'将消耗 1 次下载次数'}，是否继续？`,okText:'开始分割'}))return;

  btn.disabled=true;
  btn.textContent='分割中...';
  progBox.classList.add('active');
  outList.innerHTML='';
  progFill.style.width='0%';
  progText.textContent='准备中...';

  try{
    const r=await splitApi('/api/novels/split',{
      method:'POST',
      body:{filename:bookName+'.txt',chunkSizeMB:chunkMB}
    });
    if(!r.ok){const e=await r.json();throw new Error(e.error||'启动失败')}
    const d=await r.json();
    splitTasks[bookName]=d.taskId;
    if(typeof d.quota==='number'){U.download_quota=d.quota;updateQuotaUI()}
    _pollSplit(bookName);
  }catch(e){
    progText.textContent='❌ '+e.message;
    btn.disabled=false;
    btn.textContent='✂ 开始分割';
  }
}

// 轮询分割进度
function _pollSplit(bookName){
  const taskId=splitTasks[bookName];
  if(!taskId)return;
  const outList=document.getElementById('split-output-'+encodeURIComponent(bookName));
  const progFill=document.getElementById('split-fill-'+encodeURIComponent(bookName));
  const progText=document.getElementById('split-text-'+encodeURIComponent(bookName));
  const btn=document.getElementById('split-btn-'+encodeURIComponent(bookName));

  const bookNameForUrl=bookName; // 不含.txt

  const poll=async ()=>{
    try{
      const r=await splitApi('/api/novels/split/'+taskId);
      if(!r.ok)return;
      const d=await r.json();
      progFill.style.width=d.progress+'%';

      if(d.status==='running'){
        progText.textContent=`分割中... 已生成 ${d.chunkCount} 块`;
      }else if(d.status==='done'){
        progText.textContent=`✅ 完成！共 ${d.outputFiles.length} 个文件`;
        btn.disabled=false;
        btn.textContent='✂ 重新分割';
        refreshQuota(); // 分割已消耗 1 次下载次数，刷新显示
        // 输出文件列表
        if(d.outputFiles&&d.outputFiles.length){
          outList.innerHTML=d.outputFiles.map(f=>`
            <div class="split-output-item">
              <span class="fname">${eH(f.name)}</span>
              <span class="fsize">${f.sizeText}</span>
              <a class="fdl" href="/api/novels/download/${encodeURIComponent(bookNameForUrl)}/${encodeURIComponent(f.name)}?token=${encodeURIComponent(_splitToken())}" download>下载</a>
            </div>
          `).join('');
        }
        return; // 停止轮询
      }else if(d.status==='error'){
        progText.textContent='❌ '+d.error;
        btn.disabled=false;
        btn.textContent='✂ 重新分割';
        return;
      }
      setTimeout(poll,800);
    }catch(e){
      progText.textContent='❌ '+e.message;
      btn.disabled=false;
      btn.textContent='✂ 重新分割';
    }
  };
  poll();
}

/* 步骤进度条：滚动时高亮当前阅读到的小节 */
function initGuideSteps(){
  const steps = document.querySelectorAll('.guide-steps .gs-step');
  if(!steps.length) return;
  const cards = Array.from(document.querySelectorAll('.guide-card[data-anchor]'));
  function update(){
    let active = 1;
    const offset = window.innerHeight * 0.35;
    for(const c of cards){
      const r = c.getBoundingClientRect();
      if(r.top - offset <= 0) active = parseInt(c.dataset.anchor, 10);
    }
    steps.forEach(s=>{
      const n = parseInt(s.dataset.step, 10);
      s.classList.toggle('done', n < active);
      s.classList.toggle('on',  n === active);
    });
  }
  window.addEventListener('scroll', update, { passive:true });
  window.addEventListener('resize', update);
  update();
  // 步骤点击：平滑滚到对应小节
  steps.forEach(s=>{
    s.addEventListener('click', ()=>{
      const n = s.dataset.step;
      const target = document.getElementById('sec-'+n);
      if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
  // 目录点击：阻止默认 + 平滑滚动
  document.querySelectorAll('.guide-toc-item').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      const t = document.getElementById(a.dataset.target);
      if(t) t.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
}

async function aLoadUsers(){

  if(q!==PAG.aLastQ){PAG.aPage=1;PAG.aLastQ=q}
  const url=`/api/admin/users?page=${PAG.aPage}&per_page=${PAG.aPer}`+(q?'&q='+encodeURIComponent(q):'');
  try{
    const r=await api(url);const d=await r.json();
    const cnt=document.getElementById('aSearchCount');
    if(cnt)cnt.textContent=q?`匹配 ${d.total} 个账号`:`共 ${d.total} 个账号`;
    const target=document.getElementById('aUsers')||document.getElementById('adminUserBody');
    /* 计算全员配额总览（仅当前页） */
    const users = d.users || [];
    const totalRemain = users.reduce((a,u)=>a + (u.is_admin?0:(u.download_quota||0)), 0);
    const totalUsed   = users.reduce((a,u)=>a + (u.download_count||0), 0);
    const lowUsers    = users.filter(u=>!u.is_admin && !u.is_disabled && (u.download_quota||0)<=2).length;
    const zeroUsers   = users.filter(u=>!u.is_admin && !u.is_disabled && (u.download_quota||0)===0).length;
    if(target) target.innerHTML=`
<!-- 配额总览卡：本页用户的剩余/已用/低额/用完 -->
<div class="quota-overview">
  <div class="qo-tile">
    <div class="qo-icon">💰</div>
    <div class="qo-body">
      <div class="qo-num" id="qoRemain">${totalRemain.toLocaleString()}</div>
      <div class="qo-label">本页剩余次数</div>
    </div>
  </div>
  <div class="qo-tile">
    <div class="qo-icon">📥</div>
    <div class="qo-body">
      <div class="qo-num">${totalUsed.toLocaleString()}</div>
      <div class="qo-label">本页累计已下载</div>
    </div>
  </div>
  <div class="qo-tile ${lowUsers?'warn':''}">
    <div class="qo-icon">⚠️</div>
    <div class="qo-body">
      <div class="qo-num">${lowUsers}</div>
      <div class="qo-label">剩余 ≤ 2 次</div>
    </div>
  </div>
  <div class="qo-tile ${zeroUsers?'danger':''}">
    <div class="qo-icon">🚫</div>
    <div class="qo-body">
      <div class="qo-num">${zeroUsers}</div>
      <div class="qo-label">已用完</div>
    </div>
  </div>
</div>
<div style="overflow-x:auto">
<table class="tbl tbl-quota">
<thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>可用次数</th><th>操作</th></tr></thead>
<tbody>${users.map(u=>{
  const isAdmin = u.is_admin;
  const isDisabled = u.is_disabled;
  const remain = u.download_quota || 0;
  const used   = u.download_count || 0;
  const total  = remain + used;  // 累计获得
  const pct    = total > 0 ? Math.round(remain / total * 100) : 0;
  /* 状态判定：管理员=∞、禁用=灰色、低额=黄、用完=红、充裕=绿 */
  let stateCls = 'good', stateText = '充裕';
  if(isAdmin)        { stateCls = 'admin'; stateText = '∞ 无限'; }
  else if(isDisabled) { stateCls = 'gray';  stateText = '— 已停用'; }
  else if(remain === 0){ stateCls = 'danger'; stateText = '已用完'; }
  else if(remain <= 2) { stateCls = 'warn'; stateText = '紧张'; }
  else if(remain <= 5) { stateCls = 'mid';  stateText = '偏低'; }
  return `<tr>
    <td>${eH(u.username)}</td>
    <td><span class="tag ${isAdmin?'tag-orange':'tag-cyan'}">${isAdmin?'管理员':'用户'}</span></td>

      <div class="quota-cell">
        <div class="quota-head">
          <div class="quota-main">
            <span class="quota-remain ${stateCls}">${isAdmin?'∞':remain}</span>
            <span class="quota-unit">${isAdmin?'':'次 可用'}</span>
          </div>
          <span class="quota-state quota-state-${stateCls}">${stateText}</span>
        </div>
        ${isAdmin?'':`<div class="quota-bar" title="已用 ${used} / 累计 ${total}">

        </div>
        <div class="quota-foot">
          <span>📥 已用 <b>${used}</b></span>
          <span class="quota-mid">∑ 累计 <b>${total.toLocaleString()}</b></span>
          <span>剩 ${pct}%</span>
        </div>`}
      </div>
    </td>
    <td style="white-space:nowrap">${isAdmin?'—':`
      <input class="quota-inp" type="number" value="5" id="qD${u.id}">
      <button class="btn-xs btn-go" onclick="aQuota(${u.id})" title="加次数">+</button>
      <button class="btn-xs" style="background:#555" onclick="aQuota(${u.id},1)" title="减次数">-</button>
      <button class="btn-xs ${isDisabled?'btn-go':'btn-red'}" onclick="aToggle(${u.id},${isDisabled?'0':'1'})">${isDisabled?'启用':'禁用'}</button>

}).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:18px">暂无匹配账号</td></tr>'}</tbody></table></div>`;
    const pgEl=document.getElementById('aPager');
    if(pgEl)renderPagination(pgEl,{total:d.total,page:PAG.aPage,per_page:PAG.aPer,onPage:p=>{PAG.aPage=p;aLoadUsers()}});
  }catch(e){}
}
/* 随机生成账号密码 */
function aGenRandom(){
  const unameChars='abcdefghjkmnpqrstuvwxyz23456789';
  const pwdChars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%&*';
  const rnd=n=>{const b=new Uint8Array(n);crypto.getRandomValues(b);return b};
  const uname='user'+Array.from(rnd(6),v=>unameChars[v%unameChars.length]).join('');
  const pwd=Array.from(rnd(10),v=>pwdChars[v%pwdChars.length]).join('');
  document.getElementById('auName').value=uname;
  document.getElementById('auPass').value=pwd;
  document.getElementById('aGenText').innerHTML='👤 用户名: <b style="color:#7dd3fc">'+eH(uname)+'</b><br>🔑 密码: <b style="color:#7dd3fc">'+eH(pwd)+'</b>';
  document.getElementById('aGenBox').style.display='block';
}
function aCopyCreds(btn){
  const u=document.getElementById('auName').value.trim(),p=document.getElementById('auPass').value;
  if(!u||!p){toast.warning('请先生成或填写账号密码');return}
  const text='用户名: '+u+'\n密码: '+p;
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>aCopyOk(btn)).catch(()=>aCopyFallback(text,btn));
  }else aCopyFallback(text,btn);
}
function aCopyFallback(text,btn){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  aCopyOk(btn);
}
function aCopyOk(btn){
  const old=btn.textContent;btn.textContent='✅ 已复制';
  setTimeout(()=>{btn.textContent=old},1600);
}
async function aAddUser(){
  const n=document.getElementById('auName').value.trim(),p=document.getElementById('auPass').value,q=parseInt(document.getElementById('auQuota').value)||10;
  if(!n||!p)return;
  try{const r=await api('/api/admin/users',{method:'POST',body:{username:n,password:p,quota:q}});if(!r.ok){const d=await r.json();toast.error(d.error||'创建失败');return}
    document.getElementById('aMsg').style.display='block';document.getElementById('aMsg').textContent='创建成功!';
    document.getElementById('auName').value='';document.getElementById('auPass').value='';aLoadUsers();
    setTimeout(()=>{document.getElementById('aMsg').style.display='none'},2000);
  }catch(e){}
}
async function aQuota(uid,neg){
  const el=document.getElementById('qD'+uid);let d=parseInt(el.value)||5;if(neg)d=-d;
  try{await api('/api/admin/users/'+uid+'/quota',{method:'POST',body:{delta:d}});aLoadUsers()}catch(e){}
}
async function aToggle(uid,dis){
  try{await api(`/api/admin/users/${uid}/${dis?'disable':'enable'}`,{method:'POST'});aLoadUsers()}catch(e){}
}
async function aDel(uid,name){
  if(!await confirmDialog({title:'删除用户',message:`确认删除用户 ${name}？所有下载记录将一并删除`,okText:'删除',danger:true}))return;
  try{await api('/api/admin/users/'+uid,{method:'DELETE'});aLoadUsers();toast.success('已删除')}catch(e){toast.error('删除失败')}
}
</script>

<!-- === Toast 通知 + 确认弹窗组件 === -->
<script>
/* ═══════════════════════════════════════════════════
 * toast.js - Toast 通知 + 确认弹窗组件
 * ═══════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  const escapeHtml = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  let container = null;
  function getContainer() {
    if (!container) {
      container = document.createElement('div');
      container.className = 'toast-container';
      document.body.appendChild(container);
    }
    return container;
  }
  const VARIANTS = {
    success: { icon: '✓', title: '成功' },
    error: { icon: '✕', title: '错误' },
    warning: { icon: '⚠', title: '注意' },
    info: { icon: 'ℹ', title: '提示' },
  };
  function show(opts) {
    if (typeof opts === 'string') opts = { message: opts };
    const type = VARIANTS[opts.type] ? opts.type : 'info';
    const variant = VARIANTS[type];
    const title = opts.title != null ? opts.title : variant.title;
    const message = opts.message != null ? opts.message : '';
    const duration = opts.duration != null ? opts.duration : (type === 'error' ? 4500 : 3500);
    const closable = opts.closable !== false;
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.setAttribute('role', 'alert');
    el.innerHTML = `
      <div class="toast-icon">${variant.icon}</div>
      <div class="toast-content">
        <div class="toast-title">${escapeHtml(title)}</div>
        ${message ? `<div class="toast-message">${escapeHtml(message)}</div>` : ''}
      </div>
      ${closable ? '<button class="toast-close" aria-label="关闭">×</button>' : ''}
    `;
    let timer = null;
    const close = () => {
      if (timer) { clearTimeout(timer); timer = null; }
      el.classList.add('toast-leaving');
      setTimeout(() => el.remove(), 300);
    };
    if (closable) el.querySelector('.toast-close').addEventListener('click', close);
    if (duration > 0) timer = setTimeout(close, duration);
    el.addEventListener('mouseenter', () => { if (timer) { clearTimeout(timer); timer = null; } });
    el.addEventListener('mouseleave', () => { if (duration > 0 && !timer) timer = setTimeout(close, 1500); });
    getContainer().appendChild(el);
    return { close };
  }
  function makeShortcut(type) {
    return (msg, opts) => {
      if (typeof msg === 'string') return show(Object.assign({ type, message: msg }, opts || {}));
      return show(Object.assign({ type }, msg));
    };
  }
  const toast = { show, success: makeShortcut('success'), error: makeShortcut('error'), warning: makeShortcut('warning'), info: makeShortcut('info') };
  function confirmDialog(titleOrOpts, message, onOk, onCancel) {
    let opts;
    if (typeof titleOrOpts === 'string') opts = { title: titleOrOpts, message, onOk, onCancel };
    else opts = Object.assign({}, titleOrOpts);
    const title = opts.title || '确认';
    const msg = opts.message || '';
    const okText = opts.okText || '确定';
    const cancelText = opts.cancelText || '取消';
    const danger = opts.danger === true;
    const handleOk = opts.onOk;
    const handleCancel = opts.onCancel;
    return new Promise((resolve) => {
      const mask = document.createElement('div');
      mask.className = 'confirm-mask';
      mask.innerHTML = `
        <div class="confirm-box" role="dialog" aria-modal="true">
          <h3 class="confirm-title"><span class="confirm-icon">?</span>${escapeHtml(title)}</h3>
          <div class="confirm-message">${escapeHtml(msg)}</div>
          <div class="confirm-actions">
            <button class="confirm-btn" data-act="cancel">${escapeHtml(cancelText)}</button>
            <button class="confirm-btn ${danger ? '' : 'confirm-btn-primary'}" data-act="ok" ${danger ? 'style="background:linear-gradient(135deg,#ef4444,#dc2626);border-color:rgba(239,68,68,.4);box-shadow:0 4px 16px rgba(239,68,68,.3),inset 0 1px 0 rgba(255,255,255,.2);color:#fff;"' : ''}>${escapeHtml(okText)}</button>
          </div>
        </div>
      `;
      const close = (result) => {
        mask.style.animation = 'confirm-fade 0.18s ease forwards';
        const box = mask.querySelector('.confirm-box');
        box.style.animation = 'confirm-pop 0.18s cubic-bezier(0.4,0,0.6,1) reverse forwards';
        setTimeout(() => {
          mask.remove();
          resolve(result);
          if (result && handleOk) { try { handleOk(); } catch (e) { console.error(e); } }
          else if (!result && handleCancel) { try { handleCancel(); } catch (e) { console.error(e); } }
        }, 180);
      };
      mask.addEventListener('click', (e) => { if (e.target === mask) close(false); });
      mask.querySelector('[data-act="ok"]').addEventListener('click', () => close(true));
      mask.querySelector('[data-act="cancel"]').addEventListener('click', () => close(false));
      document.addEventListener('keydown', function escHandler(e) {
        if (e.key === 'Escape') { document.removeEventListener('keydown', escHandler); close(false); }
        if (e.key === 'Enter') { document.removeEventListener('keydown', escHandler); close(true); }
      });
      document.body.appendChild(mask);
      setTimeout(() => { const okBtn = mask.querySelector('[data-act="ok"]'); if (okBtn) okBtn.focus(); }, 50);
    });
  }
  global.toast = toast;
  global.confirmDialog = confirmDialog;
})(window);
</script>

<!-- === 骨架屏组件 === -->
<script>
/* ═══════════════════════════════════════════════════
 * skeleton.js - 骨架屏加载占位组件
 * ═══════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function $(id) { return typeof id === 'string' ? document.getElementById(id) : id; }
  function clear(c) { if (c) c.innerHTML = ''; }
  function bookGrid(containerId, count) {
    count = count || 6; const c = $(containerId); if (!c) return; clear(c);
    const grid = el('<div class="skeleton-book"></div>');
    for (let i = 0; i < count; i++) {
      grid.appendChild(el(`
        <div class="skeleton-book-card">
          <div class="skeleton-book-cover"></div>
          <div class="skeleton-book-info">
            <div class="skeleton-book-title"></div>
            <div class="skeleton-book-meta"></div>
          </div>
        </div>
      `));
    }
    c.appendChild(grid);
  }
  function fileList(containerId, count) {
    count = count || 5; const c = $(containerId); if (!c) return; clear(c);
    for (let i = 0; i < count; i++) {
      c.appendChild(el(`
        <div class="skeleton-file-row">
          <div class="skeleton-file-icon"></div>
          <div class="skeleton-file-info">
            <div class="skeleton-file-name"></div>
            <div class="skeleton-file-meta"></div>
          </div>
          <div class="skeleton-file-action"></div>
        </div>
      `));
    }
  }
  function detail(containerId) {
    const c = $(containerId); if (!c) return; clear(c);
    c.appendChild(el(`
      <div class="skeleton-detail">
        <div class="skeleton-cover"></div>
        <div class="skeleton-detail-info">
          <div class="skeleton-detail-title"></div>
          <div class="skeleton-detail-line short"></div>
          <div class="skeleton-detail-line medium"></div>
          <div class="skeleton-detail-line long"></div>
        </div>
      </div>
    `));
  }
  function text(containerId, lines) {
    lines = lines || 3; const c = $(containerId); if (!c) return; clear(c);
    for (let i = 0; i < lines; i++) c.appendChild(el('<div class="skeleton-block" style="height:12px;background:rgba(255,255,255,0.08);border-radius:6px;margin:8px 0"></div>'));
  }
  function tableRow(containerId, rows, cols) {
    rows = rows || 5; cols = cols || 4; const c = $(containerId); if (!c) return; clear(c);
    for (let i = 0; i < rows; i++) {
      const row = el('<div class="skeleton-table-row" style="display:flex;gap:16px;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,0.06)"></div>');
      for (let j = 0; j < cols; j++) {
        const cell = el('<div style="height:12px;background:rgba(255,255,255,0.08);border-radius:4px;flex:1;width:' + (60 + Math.random() * 30) + '%"></div>');
        row.appendChild(cell);
      }
      c.appendChild(row);
    }
  }
  function hide(containerId) { const c = $(containerId); if (c) clear(c); }
  global.skeleton = { bookGrid, fileList, detail, text, tableRow, hide };
})(window);
</script>

    flex-direction:column;gap:2px;border-radius:10px;
  }
  .nav-btn .nav-icon{font-size:1.15em;line-height:1}
  .nav-btn span:not(.nav-icon){font-size:.86em}

  /* 卡片：更紧的内边距 */
  .card{padding:14px;margin-bottom:12px}
  .card-header{font-size:.92em;margin-bottom:10px}

  /* 按钮：最小可点 44px */
  .btn,.btn-go,.btn-cyan,.btn-outline,.btn-ghost{
    min-height:44px;padding:11px 18px;
  }
  .btn-sm{min-height:36px;padding:7px 14px}
  .btn-xs{min-height:32px;padding:5px 10px}
  .fmt-opt{min-height:40px;padding:8px 14px}

  /* 输入框：增大触控区域 */
  .inp{padding:12px 14px;font-size:16px}  /* 16px 避免 iOS 自动放大 */
  .inp-row{gap:8px;margin-bottom:10px}
  textarea.inp{font-size:16px}

  /* 子标签 */
  .subtabs{margin-bottom:12px}
  .subtab{padding:8px 10px;font-size:.78em}

  /* 书籍网格：更密更小卡片 */
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .book-card{border-radius:12px}
  .book-card-body{padding:8px 10px}
  .book-card-title{font-size:.82em}
  .book-card-meta{font-size:.68em}

  /* 书籍详情：竖排，封面居中 */
  .book-hero{flex-direction:column;align-items:center;text-align:center;gap:12px}
  .book-cover{width:120px;min-width:120px}
  .book-meta{width:100%}
  .book-meta h3{font-size:1.1em}
  .pitch{font-size:.82em;line-height:1.6}
  .dl-section{margin-top:14px;padding-top:14px}

  /* 进度条 */
  .progress-wrap{margin-top:10px}
  .progress-label{font-size:.76em}

  /* 搜索历史 */
  .search-history{padding:8px 12px;font-size:.8em}

  /* 文件列表 */
  .file-row{padding:10px 12px;margin-bottom:8px}
  .file-row .name{font-size:.86em}
  .file-row .meta{font-size:.72em;line-height:1.4}
  .file-row .file-header{flex-direction:column;align-items:stretch;gap:8px}
  .file-row .file-header .info{flex:1 1 auto;min-width:0}
  .file-row .file-header .actions{flex-wrap:wrap;gap:6px;width:100%}
  .file-row .file-header .actions .btn-xs,
  .file-row .file-header .actions .dl{
    flex:1 1 auto;text-align:center;padding:8px 6px;font-size:.78em;
    min-width:0;white-space:nowrap;
  }
  .file-row .file-header .actions .dl{padding:8px 10px}

  /* 分割面板：单列 */
  .split-panel{padding:12px;margin-top:10px}
  .split-settings{grid-template-columns:1fr;gap:10px}
  .split-settings .split-item label{font-size:.76em}
  .split-settings .split-item select,
  .split-settings .split-item input{font-size:16px;padding:10px 12px;min-height:44px}
  .split-btn{min-height:42px;padding:10px 18px;font-size:.86em;width:100%}
  .split-output-item{padding:8px;font-size:.78em;flex-wrap:wrap;gap:6px}
  .split-output-item .fname{width:100%;margin-right:0;font-size:.78em}
  .split-output-item .fsize{font-size:.72em}
  .split-output-item .fdl{padding:5px 10px;font-size:.76em}

  /* 公告横幅：竖排 */
  .quota-banner{padding:10px 12px;font-size:.84em;gap:8px;flex-direction:column;align-items:stretch}
  .quota-banner .banner-text{font-size:.92em}
  .quota-banner .btn{width:100%}

  /* 联系管理员弹窗 */
  .contact-box{padding:18px}
  .contact-box h3{font-size:1em;margin-bottom:12px}
  .contact-row{padding:10px 12px;font-size:.86em;gap:6px}
  .contact-row .contact-val{font-size:.84em;min-width:0;word-break:break-all}
  .contact-row .btn-xs{padding:6px 10px}

  /* 模态框 */
  .modal-overlay{padding:14px;align-items:flex-end}
  .modal-box{padding:18px;border-radius:14px 14px 0 0;max-height:85vh}

  /* 仪表盘：单列 */
  .dash-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .dash-tile{padding:14px}
  .dash-tile .dt-num{font-size:1.6em}
  .dash-tile .dt-label{font-size:.72em}
  .dash-tile .dt-icon{font-size:1.4em}

  /* 用户管理表：更小字号 + 横向滚动 */
  .tbl{font-size:.72em;display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .tbl th,.tbl td{padding:8px 6px}
  .quota-inp{width:48px;font-size:.78em;padding:4px}

  /* 空状态 */
  .empty-state{padding:30px 14px}
  .empty-state .icon{font-size:2.4em}
  .empty-state p{font-size:.86em}

  /* 主题切换按钮：避免遮挡内容 */
  .theme-toggle{bottom:14px;right:14px;width:40px;height:40px;font-size:1.1em}

  /* 滚动指示器 */
  .scroll-hint{bottom:18px;width:20px;height:30px}

  /* 欢迎弹窗 */
  .welcome-content{padding:20px 18px 16px}
  .welcome-head{flex-direction:column;align-items:flex-start;gap:6px}
  .welcome-title{font-size:1.2em}
  .welcome-icon{font-size:2.2em}
  .welcome-actions{flex-direction:column-reverse;gap:8px}
  .welcome-btn{width:100%;min-height:42px;text-align:center;padding:10px 18px}
  .welcome-box{border-radius:14px;max-width:92vw}

  /* Toast */
  .toast-container{top:10px;right:10px;left:10px}
  .toast{min-width:0;max-width:100%;font-size:.86em;padding:10px 14px}

  /* 确认弹窗 */
  .confirm-box{width:min(92vw,420px);padding:18px 18px 16px;border-radius:14px}
  .confirm-actions{flex-direction:column-reverse;gap:8px}
  .confirm-btn{width:100%;min-height:42px}
}

/* ── 超小屏（≤360px）：iPhone SE 一代 / 早期安卓 ── */
@media (max-width:360px){
  body{font-size:14px}
  .container{padding:8px}
  .app-logo{font-size:1em}
  .nav-btn{font-size:.72em;padding:5px 1px}
  .nav-btn .nav-icon{font-size:1em}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
  .card{padding:12px}
  .btn{padding:10px 14px;font-size:.84em}
  .guide-hero{padding:18px 16px 16px}
  .guide-hero-icon{font-size:2.6em}
  .guide-hero-title{font-size:1.2em}
  .guide-hero-sub{font-size:.8em}
  .gs-step{padding:2px 6px 2px 2px}
  .gs-num{width:16px;height:16px;font-size:.78em}
  .dash-grid{grid-template-columns:1fr}
  .tbl{font-size:.68em}
}

/* ── 横屏 / 大屏 1100px+ ── */
@media (min-width:1100px){
  .container{padding:24px}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}

/* ── 触控优化：去除点击高亮 + 平滑滚动 ── */
*{
  -webkit-tap-highlight-color:transparent;
}
html{scroll-behavior:smooth}
button,.nav-btn,.gs-step,.book-card,.file-row,.guide-toc-item{cursor:pointer}
button{min-height:36px}
.nav-btn,.gs-step,.book-card{transition:transform .2s,box-shadow .2s}

/* ── 折叠屏 / 极宽屏 1400px+ ── */
@media (min-width:1400px){
  .container{max-width:1240px}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}

/* ═══════════════════════════════════════════════════
 * 番茄/七猫 tab 顶部提示条：「不知道怎么用？点击查看指南」
 * ═══════════════════════════════════════════════════ */
.tab-hint{
  display:flex;align-items:center;gap:10px;
  padding:11px 16px;margin-bottom:12px;
  border-radius:12px;
  background:linear-gradient(135deg,rgba(255,107,53,.10),rgba(14,165,233,.08));
  border:1px solid rgba(255,107,53,.22);
  cursor:pointer;
  font-size:.88em;color:var(--text2);
  transition:.25s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  user-select:none;
}
.tab-hint:hover{
  border-color:rgba(255,107,53,.45);
  background:linear-gradient(135deg,rgba(255,107,53,.16),rgba(14,165,233,.12));
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
}
.tab-hint:active{transform:translateY(0) scale(.99)}
.tab-hint-icon{
  font-size:1.15em;flex-shrink:0;
  filter:drop-shadow(0 2px 8px rgba(255,150,90,.35));
}
.tab-hint-text{flex:1;min-width:0;line-height:1.5}
.tab-hint-text b{
  color:#ffb08f;font-weight:600;
  border-bottom:1px dashed rgba(255,176,143,.4);
  padding-bottom:1px;
}
.tab-hint-arrow{
  font-size:1.4em;color:var(--text3);flex-shrink:0;
  transition:.25s;
}
.tab-hint:hover .tab-hint-arrow{color:var(--orange);transform:translateX(3px)}
@media (max-width:640px){
  .tab-hint{padding:10px 12px;font-size:.82em;gap:8px;margin-bottom:10px;border-radius:10px}
  .tab-hint-icon{font-size:1.05em}
  .tab-hint-arrow{font-size:1.2em}
}

/* ═══════════════════════════════════════════════════
 * 文件 tab 顶部「请勿使用微信打开」警示卡片
 * ═══════════════════════════════════════════════════ */
.browser-warn{
  display:flex;align-items:flex-start;gap:14px;
  padding:16px 18px;margin-bottom:14px;
  border-radius:14px;
  background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(239,68,68,.08));
  border:1px solid rgba(245,158,11,.35);
  box-shadow:0 6px 22px rgba(245,158,11,.10), inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;overflow:hidden;
  animation:bwIn .5s cubic-bezier(.2,.7,.3,1);
}
@keyframes bwIn{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:none}
}
.browser-warn::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#f59e0b,#ef4444);
  box-shadow:0 0 14px rgba(245,158,11,.5);
}
.bw-icon{
  font-size:1.7em;flex-shrink:0;line-height:1.1;
  filter:drop-shadow(0 4px 12px rgba(245,158,11,.4));
  margin-top:1px;
}
.bw-content{flex:1;min-width:0}
.bw-title{
  font-size:1em;font-weight:700;color:#fbbf24;
  margin-bottom:6px;letter-spacing:.3px;
}
.bw-desc{
  font-size:.84em;color:rgba(255,255,255,.82);line-height:1.7;
  margin-bottom:10px;
}
.bw-desc b{color:#fed7aa;font-weight:600}
.bw-copy{
  padding:6px 14px!important;font-size:.8em!important;
  min-height:34px!important;border-radius:18px!important;
  box-shadow:0 4px 14px rgba(255,107,53,.3), inset 0 1px 0 rgba(255,255,255,.2)!important;
}
@media (max-width:640px){
  .browser-warn{padding:12px 14px;gap:10px;margin-bottom:12px;border-radius:12px}
  .bw-icon{font-size:1.4em}
  .bw-title{font-size:.92em}
  .bw-desc{font-size:.78em;margin-bottom:8px;line-height:1.6}
  .bw-copy{width:100%;text-align:center}
}

/* ═══════════════════════════════════════════════════
 * 管理员 · 用户管理 · 配额总览卡（4 个统计）
 * ═══════════════════════════════════════════════════ */
.quota-overview{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin-bottom:14px;
}
.qo-tile{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:12px;
  background:linear-gradient(135deg,rgba(255,107,53,.10),rgba(14,165,233,.06));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:.2s;position:relative;overflow:hidden;
}
.qo-tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.qo-tile.warn{
  background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(245,158,11,.04));
  border-color:rgba(245,158,11,.35);
}
.qo-tile.danger{
  background:linear-gradient(135deg,rgba(239,68,68,.16),rgba(239,68,68,.04));
  border-color:rgba(239,68,68,.4);
}
.qo-icon{font-size:1.6em;flex-shrink:0;line-height:1;filter:drop-shadow(0 2px 8px rgba(255,150,90,.3))}
.qo-body{flex:1;min-width:0}
.qo-num{
  font-size:1.5em;font-weight:800;line-height:1.1;color:var(--text);
  font-variant-numeric:tabular-nums;letter-spacing:.3px;
}
.qo-tile.warn   .qo-num{color:#fbbf24}
.qo-tile.danger .qo-num{color:#fca5a5}
.qo-label{font-size:.72em;color:var(--text3);margin-top:2px;line-height:1.3}
@media (max-width:640px){
  .quota-overview{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .qo-tile{padding:10px 12px;gap:8px}
  .qo-icon{font-size:1.3em}
  .qo-num{font-size:1.2em}
  .qo-label{font-size:.68em}
}

/* ═══════════════════════════════════════════════════
 * 管理员 · 用户表格 · 配额可视化（数字 + 进度条 + 状态）
 * ═══════════════════════════════════════════════════ */
.tbl-quota td:nth-child(4){min-width:240px;padding:10px 12px}
.quota-cell{display:flex;flex-direction:column;gap:5px;min-width:0}
.quota-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.quota-main{display:flex;align-items:baseline;gap:4px;min-width:0}
.quota-remain{
  font-size:1.3em;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.3px;
  text-shadow:0 0 14px currentColor;
}
.quota-remain.good   {color:#22c55e}
.quota-remain.mid    {color:#facc15}
.quota-remain.warn   {color:#fb923c}
.quota-remain.danger {color:#f87171;text-shadow:0 0 14px rgba(239,68,68,.5)}
.quota-remain.admin  {
  color:#7dd3fc;font-size:1.4em;
  text-shadow:0 0 14px rgba(125,211,252,.5);
}
.quota-remain.gray   {color:var(--text3);text-shadow:none}
.quota-unit{font-size:.72em;color:var(--text3);white-space:nowrap}
/* 状态徽章 */
.quota-state{
  font-size:.66em;font-weight:700;padding:2px 8px;border-radius:8px;
  white-space:nowrap;letter-spacing:.3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.quota-state-good   {background:rgba(34,197,94,.16);color:#4ade80;border:1px solid rgba(34,197,94,.35)}
.quota-state-mid    {background:rgba(250,204,21,.16);color:#fde047;border:1px solid rgba(250,204,21,.35)}
.quota-state-warn   {background:rgba(251,146,60,.16);color:#fdba74;border:1px solid rgba(251,146,60,.35)}
.quota-state-danger {background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.quota-state-admin  {background:rgba(125,211,252,.18);color:#7dd3fc;border:1px solid rgba(125,211,252,.4)}
.quota-state-gray   {background:rgba(255,255,255,.06);color:var(--text3);border:1px solid rgba(255,255,255,.12)}
/* 进度条 */
.quota-bar{
  position:relative;width:100%;height:6px;border-radius:3px;
  background:rgba(255,255,255,.08);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35);
  overflow:hidden;
}
.quota-bar-fill{
  height:100%;border-radius:3px;
  transition:width .5s cubic-bezier(.2,.7,.3,1);
  box-shadow:0 0 10px currentColor;
}
.quota-bar-good   {background:linear-gradient(90deg,#22c55e,#16a34a);color:#22c55e}
.quota-bar-mid    {background:linear-gradient(90deg,#facc15,#eab308);color:#facc15}
.quota-bar-warn   {background:linear-gradient(90deg,#fb923c,#f97316);color:#fb923c}
.quota-bar-danger {background:linear-gradient(90deg,#f87171,#ef4444);color:#f87171}
/* 进度条扫光（轻量特效） */
.quota-bar-fill::after{
  content:'';position:absolute;inset:0;width:36%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:fillSweep 2.2s ease-in-out infinite;
  pointer-events:none;
}
/* 底部元数据：已用 / 累计 / 剩余百分比 */
.quota-foot{
  display:flex;justify-content:space-between;gap:8px;
  font-size:.7em;color:var(--text3);line-height:1.3;
}
.quota-foot b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.quota-mid{color:var(--text2)!important}

@media (max-width:640px){
  .tbl-quota td:nth-child(4){min-width:0;padding:8px 6px}
  .quota-remain{font-size:1.1em}
  .quota-state{font-size:.6em;padding:2px 6px}
  .quota-foot{font-size:.66em;flex-wrap:wrap;gap:4px}
  .quota-unit{font-size:.68em}
}

/* ═══════════════════════════════════════════════════
 * 管理员：无限下载专属样式
 * ═══════════════════════════════════════════════════ */
.quota-pill.admin-infinity{
  background:linear-gradient(135deg,#7dd3fc,#0284c7)!important;
  box-shadow:0 4px 14px rgba(125,211,252,.45), inset 0 1px 0 rgba(255,255,255,.3);
  position:relative;
  animation:adminInfinityPulse 2.5s ease-in-out infinite;
}
@keyframes adminInfinityPulse{
  0%,100%{box-shadow:0 4px 14px rgba(125,211,252,.45), inset 0 1px 0 rgba(255,255,255,.3)}
  50%{box-shadow:0 4px 22px rgba(125,211,252,.7), inset 0 1px 0 rgba(255,255,255,.4)}
}

.admin-panel-btn{
  background:linear-gradient(135deg,rgba(125,211,252,.18),rgba(56,189,248,.10))!important;
  border-color:rgba(125,211,252,.4)!important;
  color:#7dd3fc!important;
}
.admin-panel-btn:hover{
  background:linear-gradient(135deg,rgba(125,211,252,.28),rgba(56,189,248,.16))!important;
  border-color:#7dd3fc!important;
  color:#fff!important;
}

/* 管理员横幅 */
.admin-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:11px 16px;margin-bottom:16px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,rgba(125,211,252,.12),rgba(255,107,53,.08));
  border:1px solid rgba(125,211,252,.4);
  font-size:.9em;
  box-shadow:0 4px 18px rgba(125,211,252,.10), inset 0 1px 0 rgba(255,255,255,.06);
}
.admin-banner .banner-text{color:var(--text);display:flex;align-items:center;gap:8px}
.admin-banner .banner-text .bell{font-size:1.05em}
.admin-banner b{color:#7dd3fc;font-weight:700}

/* ═══════════════════════════════════════════════════
 * 管理员面板弹窗
 * ═══════════════════════════════════════════════════ */
.admin-panel-mask{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:20px;
}
.admin-panel-mask.show{display:flex}
.admin-panel-box{
  width:min(960px,96vw);max-height:88vh;overflow-y:auto;
  background:linear-gradient(170deg,#1c1c33,#15152a);
  border:1px solid rgba(125,211,252,.25);
  border-radius:18px;
  box-shadow:0 28px 80px rgba(0,0,0,.6), 0 0 60px rgba(125,211,252,.12), inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;overflow:hidden;
  animation:adminPanelIn .35s cubic-bezier(.2,.7,.3,1);
}
@keyframes adminPanelIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.admin-panel-box::before{
  content:'';position:absolute;top:0;left:6%;right:6%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(125,211,252,.5),transparent);
}
.admin-panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 22px 14px;
  border-bottom:1px solid rgba(125,211,252,.18);
  position:sticky;top:0;z-index:1;
  background:linear-gradient(180deg,rgba(28,28,51,.95),rgba(28,28,51,.85));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.admin-panel-title{
  font-size:1.05em;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#ffffff,#7dd3fc 50%,#ffb08f);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.admin-panel-close{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:var(--text2);width:32px;height:32px;border-radius:50%;
  cursor:pointer;font-size:1.2em;line-height:1;
